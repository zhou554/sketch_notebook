<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记忆笔记 · 线条海景</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3ede2; --surface: #fffbf5; --ink: #2c261e; --muted: #6f675c;
      --line: #c9bdb0; --accent: #4f5d45; --due: #8f3a32;
      --font-serif: "Noto Serif SC", Georgia, serif;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --list-opacity: 0.88;
      --phone-w: 360px; --phone-h: 740px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    body {
      font-family: var(--font-sans); color: var(--ink); min-height: 100vh;
      background: radial-gradient(ellipse 55% 40% at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 55%), var(--bg);
    }
    .page {
      max-width: 960px; margin: 0 auto; padding: 36px 20px 48px;
      display: grid; grid-template-columns: minmax(200px, 1fr) auto; gap: 36px; align-items: start;
    }
    @media (max-width: 800px) { .page { grid-template-columns: 1fr; justify-items: center; } }
    .panel h1 { font-family: var(--font-serif); font-size: 1.7rem; font-weight: 600; margin: 8px 0 12px; }
    .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .panel p { color: var(--muted); font-size: 14px; max-width: 34ch; }
    .panel ul { list-style: none; margin-top: 20px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 80%, transparent); }
    .panel li { display: grid; grid-template-columns: 64px 1fr; border-bottom: 1px solid var(--line); font-size: 13px; }
    .panel li:last-child { border-bottom: none; }
    .panel li span:first-child { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 11px; border-right: 1px solid var(--line); }
    .panel li span:last-child { padding: 11px 12px; }

    .phone {
      width: min(var(--phone-w), 100%); height: var(--phone-h);
      border: 1px solid #b8aea0; border-radius: 28px; overflow: hidden;
      display: flex; flex-direction: column; background: var(--bg);
      box-shadow: 0 22px 44px rgba(44,38,30,0.12); position: relative;
    }
    .notch { height: 20px; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; place-items: center; flex-shrink: 0; }
    .notch::after { content: ""; width: 70px; height: 5px; border-radius: 3px; background: rgba(44,38,30,0.16); }

    .stage { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; }
    /* 全屏线条海 —— 照搬 line-minimal-ui .scene-bg */
    .sea {
      position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: transparent;
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.55) 45%,
        rgba(0, 0, 0, 0.85) 78%,
        rgba(0, 0, 0, 0.95) 100%
      );
    }
    .sea svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }
    .sea-horizon { stroke: var(--line); stroke-width: 0.7; opacity: 0.4; }
    #waves path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .w1 { stroke: var(--line); stroke-width: 0.75; opacity: 0.47; }
    .w2 { stroke: var(--accent); stroke-width: 0.7; opacity: 0.3; }
    .w3 { stroke: var(--line); stroke-width: 0.65; opacity: 0.37; }
    .w4 { stroke: var(--line); stroke-width: 0.65; opacity: 0.27; }
    .w5 { stroke: var(--line); stroke-width: 0.6; opacity: 0.32; }
    .w6 { stroke: var(--muted); stroke-width: 0.55; opacity: 0.22; }
    .sea-fx { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .sea-tap {
      position: absolute; left: 0; right: 0; bottom: 0; height: min(42%, 320px);
      z-index: 1; border: 0; background: transparent; cursor: pointer; pointer-events: auto;
    }

    .chrome {
      position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1; min-height: 0;
    }
    .header {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 18px 14px 12px; font-family: var(--font-serif); font-size: 1.15rem; font-weight: 600;
      letter-spacing: 0.06em; background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .header button {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      font-family: var(--font-mono); font-size: 11px; padding: 6px 10px; cursor: pointer;
    }
    .list-area { flex: 1; overflow-y: auto; position: relative; padding-bottom: 84px; background: transparent; }
    .empty { display: none; text-align: center; padding: 48px 24px; color: var(--muted); font-size: 14px; white-space: pre-line; cursor: pointer; }
    .empty.show { display: block; }
    .note-row {
      width: 100%; text-align: left; border: none; cursor: pointer; font-family: inherit; color: inherit;
      background:
        linear-gradient(var(--accent), var(--accent)) left / 1px 100% no-repeat,
        linear-gradient(var(--line), var(--line)) bottom / 100% 1px no-repeat,
        color-mix(in srgb, var(--surface) calc(var(--list-opacity) * 100%), transparent);
      padding: 14px 14px 12px 18px;
      backdrop-filter: blur(2px);
    }
    .note-row:hover { filter: brightness(0.99); }
    .note-title { font-family: var(--font-serif); font-weight: 600; font-size: 15px; }
    .note-preview { margin-top: 5px; font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note-footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .note-review { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .note-review.due { color: var(--due); }
    .btn-del { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--muted); font-family: var(--font-mono); font-size: 11px; padding: 5px 9px; cursor: pointer; }
    .fab {
      position: absolute; right: 16px; bottom: 16px; z-index: 3; width: 48px; height: 48px;
      border-radius: 50%; border: none; background: var(--accent); color: var(--surface);
      font-size: 24px; cursor: pointer; display: grid; place-items: center;
      box-shadow: 0 2px 10px rgba(44,38,30,0.18);
    }

    .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .view.active { display: flex; }
    .settings-body { flex: 1; overflow-y: auto; padding: 16px; background: color-mix(in srgb, var(--surface) 92%, transparent); }
    .field-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 12px 0 6px; letter-spacing: 0.05em; }
    .slider-row { display: grid; grid-template-columns: 1fr 48px; gap: 8px; align-items: center; margin-bottom: 8px; }
    .slider-row input { width: 100%; accent-color: var(--accent); }
    .slider-row span { font-family: var(--font-mono); font-size: 12px; text-align: right; }
    .themes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .themes button { border: 1px solid var(--line); padding: 8px 12px; font-size: 12px; cursor: pointer; background: var(--surface); color: var(--ink); font-family: inherit; }
    .themes button.on { background: var(--accent); color: var(--surface); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .back-hdr { cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .back-hdr svg { stroke: currentColor; fill: none; stroke-width: 1.2; }
    .caption { margin-top: 12px; text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

    /* 鱼：抛物线跃起后自然落入水中渐隐；贝壳：入水渐隐，无水花 */
    .fish {
      position: absolute; width: 30px; height: 15px; color: var(--ink);
      pointer-events: none; --dir: -1; transform-origin: 55% 88%;
      animation: fish-arc 0.78s linear forwards;
    }
    .fish.to-right { --dir: 1; }
    .fish.to-right svg { transform: scaleX(-1); }
    .fish svg {
      width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .fish svg .eye { fill: currentColor; stroke: none; }
    /* 顶点约 28%，随后加速落入水中 */
    @keyframes fish-arc {
      0% { opacity: 0; transform: translate(0, 0) rotate(calc(var(--dir) * -8deg)) scale(0.9); }
      5% { opacity: 0.92; }
      28% { opacity: 0.92; transform: translate(calc(var(--dir) * 16px), -32px) rotate(calc(var(--dir) * -22deg)) scale(1); }
      52% { opacity: 0.92; transform: translate(calc(var(--dir) * 30px), -8px) rotate(calc(var(--dir) * 2deg)) scale(1); }
      72% { opacity: 0.5; transform: translate(calc(var(--dir) * 42px), 6px) rotate(calc(var(--dir) * 14deg)) scale(0.94); }
      100% { opacity: 0; transform: translate(calc(var(--dir) * 58px), 18px) rotate(calc(var(--dir) * 26deg)) scale(0.86); }
    }
    .shell {
      position: absolute; width: 34px; height: 26px; color: var(--accent);
      pointer-events: none; opacity: 0;
      animation: shell-sink var(--drop-ms, 2200ms) cubic-bezier(0.4, 0.15, 0.55, 1) forwards;
    }
    .shell svg {
      width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.1;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    @keyframes shell-sink {
      0% { opacity: 0; transform: translate(0, 0) rotate(var(--spin-start, -12deg)); }
      7% { opacity: 0.7; }
      62% { opacity: 0.7; }
      100% { opacity: 0; transform: translate(var(--drift, 0px), var(--fall, 400px)) rotate(var(--spin-end, 160deg)); }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <g id="fish-art" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 13.5 C9 5.5 20 3 32 6.5 C38 8.5 42.5 11.5 40.5 15 C38.5 18.5 28 20.5 16 19.2 C9.5 18.2 5 16.5 3.5 13.5 Z"/>
        <path d="M39.5 13.2 Q44 9.5 48.5 7.5"/>
        <path d="M39.5 15.2 Q44 18.5 48.5 20.5"/>
        <path d="M48.5 7.5 Q47.2 14 48.5 20.5"/>
        <path d="M22 5.2 Q27 6.5 30 9"/>
        <circle class="eye" cx="15" cy="12" r="1.35"/>
      </g>
      <g id="shell-art" stroke="currentColor" fill="none">
        <path d="M36 52 L8 36 Q4 22 12 12 Q22 4 36 6 Q50 4 60 12 Q68 22 64 36 Z"/>
        <path d="M36 52 L36 8"/>
        <path d="M36 52 L12 12"/>
        <path d="M36 52 L22 8"/>
        <path d="M36 52 L50 8"/>
        <path d="M36 52 L60 12"/>
      </g>
    </defs>
  </svg>

  <div class="page">
    <aside class="panel">
      <p class="eyebrow">App layout preview</p>
      <h1>线条海景<br />浮在列表下</h1>
      <p>海景照搬 line-minimal-ui：全屏细线波浪、点按跃鱼、落贝壳。顶栏不透明，列表半透明。</p>
      <ul>
        <li><span>海景</span><span>全屏纯线条，非色块</span></li>
        <li><span>互动</span><span>点空白 / 海面出小鱼</span></li>
        <li><span>设置</span><span>透明度 / 海浪 / 贝壳 / 主题</span></li>
      </ul>
    </aside>

    <div>
      <div class="phone">
        <div class="notch"></div>
        <div class="stage">
          <div class="sea" id="sea">
            <svg viewBox="0 0 1200 320" preserveAspectRatio="none" aria-hidden="true">
              <line class="sea-horizon" id="horizon" x1="0" y1="248" x2="1200" y2="248"/>
              <g id="waves"></g>
            </svg>
          </div>
          <div class="sea-fx" id="fx" aria-hidden="true"></div>
          <button class="sea-tap" id="sea-tap" type="button" aria-label="点击海面，小鱼跃起"></button>

          <div class="chrome">
            <section class="view active" id="view-list">
              <header class="header">
                <span>记忆笔记</span>
                <button type="button" id="btn-settings">设置</button>
              </header>
              <div class="list-area">
                <div class="empty" id="empty"></div>
                <div id="notes"></div>
              </div>
              <button type="button" class="fab" id="fab">+</button>
            </section>

            <section class="view" id="view-settings">
              <header class="header back-hdr" id="settings-back" tabindex="0">
                <svg width="16" height="16" viewBox="0 0 24 24"><path d="M15 6 L9 12 L15 18"/></svg>
                设置
              </header>
              <div class="settings-body">
                <div class="field-label">列表格透明度</div>
                <div class="slider-row">
                  <input type="range" id="op" min="20" max="100" value="88" />
                  <span id="op-v">88%</span>
                </div>
                <p class="hint">列表格浮在底部海景上，越低海景越清晰</p>
                <div class="field-label">主题颜色</div>
                <div class="themes" id="themes"></div>
                <div class="field-label">海浪高度</div>
                <div class="slider-row"><input type="range" id="h" min="0" max="100" value="50" /><span id="h-v">50</span></div>
                <div class="field-label">海浪起伏</div>
                <div class="slider-row"><input type="range" id="a" min="0" max="100" value="45" /><span id="a-v">45</span></div>
                <div class="field-label">贝壳频率</div>
                <div class="slider-row"><input type="range" id="s" min="0" max="100" value="45" /><span id="s-v">45</span></div>
                <p class="hint">0 关闭贝壳</p>
              </div>
            </section>
          </div>
        </div>
      </div>
      <p class="caption">照搬 line-minimal-ui：全屏线条海 + 点按跃鱼 + 落贝壳</p>
    </div>
  </div>

  <script>
    const Themes = {
      parchment: { label: "羊皮纸", bg: "#f3ede2", surface: "#fffbf5", ink: "#2c261e", muted: "#6f675c", line: "#c9bdb0", accent: "#4f5d45", due: "#8f3a32" },
      sage: { label: "鼠尾草", bg: "#e8f0ea", surface: "#f7fbf8", ink: "#243028", muted: "#5f6e64", line: "#b7c7bb", accent: "#3e6b52", due: "#8f3a32" },
      sky: { label: "淡天蓝", bg: "#e8eef5", surface: "#f7fafd", ink: "#1f2a38", muted: "#5c6b7a", line: "#b8c4d1", accent: "#3d5a73", due: "#8f3a32" },
      rose: { label: "浅玫瑰", bg: "#f3e9ea", surface: "#fcf7f7", ink: "#322428", muted: "#746066", line: "#d0c0c3", accent: "#7a4e57", due: "#8f3a32" },
      ink: { label: "暖墨", bg: "#ede8e0", surface: "#f8f4ed", ink: "#1a1814", muted: "#6a6358", line: "#c4b9a8", accent: "#3a3630", due: "#8f3a32" },
    };
    const Tune = {
      opacity: +(localStorage.getItem("ns-op") || 88),
      height: +(localStorage.getItem("ns-h") || 50),
      amp: +(localStorage.getItem("ns-a") || 45),
      shell: +(localStorage.getItem("ns-s") || 45),
      theme: localStorage.getItem("ns-theme") || "parchment",
    };

    function applyTheme(id) {
      const t = Themes[id] || Themes.parchment;
      Tune.theme = id;
      localStorage.setItem("ns-theme", id);
      const r = document.documentElement.style;
      Object.entries({ bg: t.bg, surface: t.surface, ink: t.ink, muted: t.muted, line: t.line, accent: t.accent, due: t.due })
        .forEach(([k, v]) => r.setProperty(`--${k}`, v));
      document.querySelectorAll("#themes button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
    }

    function setOpacity(v) {
      Tune.opacity = v;
      localStorage.setItem("ns-op", v);
      document.documentElement.style.setProperty("--list-opacity", String(v / 100));
      document.getElementById("op-v").textContent = v + "%";
    }

    const notes = [
      { id: 1, title: "英语单词 Unit 3", content: "主动回忆比反复阅读更有效。", due: true },
      { id: 2, title: "艾宾浩斯曲线要点", content: "间隔：1、2、4、7、15、30 天。", due: false },
    ];

    function renderNotes() {
      const box = document.getElementById("notes");
      const empty = document.getElementById("empty");
      empty.textContent = "还没有笔记\n点右下角 +，写下第一条学习笔记";
      empty.classList.toggle("show", !notes.length);
      box.innerHTML = "";
      notes.forEach((n) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "note-row";
        b.innerHTML = `<div class="note-title"></div><div class="note-preview"></div><div class="note-footer"><div class="note-review"></div><span class="btn-del">删除</span></div>`;
        b.querySelector(".note-title").textContent = n.title;
        b.querySelector(".note-preview").textContent = n.content;
        const rev = b.querySelector(".note-review");
        rev.textContent = n.due ? "待复习" : "下次复习：明天";
        if (n.due) rev.classList.add("due");
        b.querySelector(".btn-del").onclick = (e) => {
          e.stopPropagation();
          const i = notes.findIndex((x) => x.id === n.id);
          if (i >= 0) notes.splice(i, 1);
          renderNotes();
        };
        box.appendChild(b);
      });
    }

    function show(name) {
      document.getElementById("view-list").classList.toggle("active", name === "list");
      document.getElementById("view-settings").classList.toggle("active", name === "settings");
    }

    document.getElementById("btn-settings").onclick = () => show("settings");
    document.getElementById("settings-back").onclick = () => show("list");
    document.getElementById("fab").onclick = () => {
      notes.push({ id: Date.now(), title: "新笔记 " + (notes.length + 1), content: "点击设置可调节列表格透明度。", due: false });
      renderNotes();
    };

    const themesEl = document.getElementById("themes");
    Object.entries(Themes).forEach(([id, t]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t.label;
      b.dataset.id = id;
      b.onclick = () => applyTheme(id);
      themesEl.appendChild(b);
    });

    function bind(id, key, labelId, fmt) {
      const el = document.getElementById(id);
      el.value = Tune[key];
      document.getElementById(labelId).textContent = fmt(Tune[key]);
      el.oninput = () => {
        Tune[key] = +el.value;
        localStorage.setItem("ns-" + (key === "opacity" ? "op" : key[0]), Tune[key]);
        document.getElementById(labelId).textContent = fmt(Tune[key]);
        if (key === "opacity") setOpacity(Tune[key]);
      };
    }
    setOpacity(Tune.opacity);
    applyTheme(Tune.theme);
    bind("op", "opacity", "op-v", (v) => v + "%");
    document.getElementById("op").oninput = (e) => setOpacity(+e.target.value);
    bind("h", "height", "h-v", String);
    bind("a", "amp", "a-v", String);
    bind("s", "shell", "s-v", String);
    renderNotes();

    (function sea() {
      const g = document.getElementById("waves");
      const fx = document.getElementById("fx");
      const sea = document.getElementById("sea");
      const stage = sea.parentElement;
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const W = 1200;
      const layers = [
        { cls: "w1", baseY: 256, amp: 3.6, freq: 0.018, speed: 0.3 },
        { cls: "w2", baseY: 265, amp: 4.8, freq: 0.014, speed: 0.24 },
        { cls: "w3", baseY: 274, amp: 3.2, freq: 0.022, speed: 0.36 },
        { cls: "w4", baseY: 283, amp: 4.0, freq: 0.016, speed: 0.2 },
        { cls: "w5", baseY: 292, amp: 2.6, freq: 0.025, speed: 0.42 },
        { cls: "w6", baseY: 301, amp: 2.2, freq: 0.02, speed: 0.16 },
      ];
      const paths = layers.map((L) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("class", L.cls);
        g.appendChild(p);
        return { el: p, ...L };
      });
      function wavePath(baseY, amp, freq, phase) {
        let d = `M 0 ${baseY}`;
        for (let x = 0; x <= W; x += 12) {
          d += ` L ${x} ${(baseY + Math.sin(x * freq + phase) * amp).toFixed(1)}`;
        }
        return d;
      }
      function yOff() { return ((50 - Tune.height) / 50) * 42; }
      function ampMul() { return 0.35 + (Tune.amp / 100) * 0.85; }
      function redraw(t) {
        const off = yOff(), mul = ampMul();
        const hy = 248 + off;
        document.getElementById("horizon").setAttribute("y1", String(hy));
        document.getElementById("horizon").setAttribute("y2", String(hy));
        paths.forEach(({ el, baseY, amp, freq, speed }) => {
          el.setAttribute("d", wavePath(baseY + off, amp * mul * 0.55, freq, t * speed * Math.PI * 2));
        });
      }
      function surfaceY() {
        const r = sea.getBoundingClientRect();
        return r.top + r.height * ((248 + yOff()) / 320);
      }
      function spawnFish(clientX) {
        const r = stage.getBoundingClientRect();
        const el = document.createElement("div");
        const right = Math.random() > 0.5;
        el.className = "fish" + (right ? " to-right" : "");
        el.style.left = clientX - r.left - 15 + "px";
        el.style.top = surfaceY() - r.top - 10 + "px";
        el.innerHTML = `<svg viewBox="0 0 52 22" aria-hidden="true"><use href="#fish-art" transform="translate(0,1) scale(1.05)"/></svg>`;
        fx.appendChild(el);
        el.addEventListener("animationend", () => el.remove(), { once: true });
        setTimeout(() => el.remove(), 900);
      }
      function dropShell() {
        if (Tune.shell <= 0) return;
        const r = stage.getBoundingClientRect();
        const sizeW = 34;
        const startX = 24 + Math.random() * (r.width - 48 - sizeW);
        const zoneTop = r.height * (0.04 + Math.random() * 0.22);
        const seaY = surfaceY();
        // 略沉入水面下，配合渐隐
        const fallPx = Math.max(seaY - r.top - zoneTop - 8, 120) + 22;
        const drift = (Math.random() - 0.5) * 48;
        const dropMs = Math.round(1600 + fallPx * 1.35 + Math.random() * 400);
        const el = document.createElement("div");
        el.className = "shell";
        el.style.left = startX + "px";
        el.style.top = zoneTop + "px";
        el.style.setProperty("--fall", fallPx + "px");
        el.style.setProperty("--drift", drift + "px");
        el.style.setProperty("--drop-ms", dropMs + "ms");
        el.style.setProperty("--spin-start", -20 + Math.random() * 40 + "deg");
        el.style.setProperty("--spin-end", 120 + Math.random() * 120 + "deg");
        el.innerHTML = `<svg viewBox="0 0 72 58" aria-hidden="true"><use href="#shell-art"/></svg>`;
        fx.appendChild(el);
        el.addEventListener("animationend", () => el.remove(), { once: true });
      }
      document.getElementById("sea-tap").addEventListener("click", (e) => spawnFish(e.clientX));
      document.querySelector(".list-area").addEventListener("click", (e) => {
        if (e.target.closest(".note-row") || e.target.closest(".btn-del")) return;
        spawnFish(e.clientX);
      });
      if (reduce) {
        redraw(0);
      } else {
        let t0 = 0;
        (function frame(ts) {
          if (!t0) t0 = ts;
          redraw((ts - t0) * 0.001);
          requestAnimationFrame(frame);
        })(performance.now());
        (function loopF() {
          setTimeout(() => {
            const r = stage.getBoundingClientRect();
            spawnFish(r.left + 48 + Math.random() * (r.width - 96));
            loopF();
          }, 6000 + Math.random() * 11000);
        })();
        (function loopS() {
          const base = 9000 + Math.random() * 15000;
          const scale = Tune.shell <= 0 ? 1 : 1.6 - Tune.shell / 100;
          const wait = Tune.shell <= 0 ? 8000 : Math.max(3500, base * scale);
          setTimeout(() => { dropShell(); loopS(); }, wait);
        })();
        setTimeout(dropShell, 4000 + Math.random() * 3000);
      }
    })();
  </script>
</body>
</html>
