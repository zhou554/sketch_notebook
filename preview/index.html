<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记忆笔记 · 线条界面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3ede2;
      --surface: #fffbf5;
      --ink: #2c261e;
      --muted: #6f675c;
      --line: #c9bdb0;
      --line-faint: rgba(201, 189, 176, 0.42);
      --accent: #4f5d45;
      --accent-soft: rgba(79, 93, 69, 0.07);
      --due: #8f3a32;
      --font-serif: "Noto Serif SC", Georgia, serif;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --shell-w: 400px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --shell-bg-alpha: 0.88;
      --shell-blur: 11px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 50% 100%, rgba(79, 93, 69, 0.07) 0%, transparent 58%),
        radial-gradient(ellipse 55% 40% at 0% 0%, rgba(240, 232, 235, 0.45) 0%, transparent 52%),
        radial-gradient(ellipse 50% 35% at 100% 15%, rgba(230, 239, 232, 0.4) 0%, transparent 48%),
        var(--bg);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(var(--line-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 85% 75% at 50% 28%, black 12%, transparent 68%);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto minmax(240px, 1fr);
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-3);
      pointer-events: none;
    }

    .page .shell,
    .page .about,
    .page .interval-strip {
      pointer-events: auto;
    }

    @media (max-width: 960px) {
      .page {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 24px 16px 48px;
      }
      .about { display: none; }
    }

    .about {
      justify-self: end;
      max-width: 280px;
      padding-right: 8px;
    }

    .about-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .about h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .about-lead {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .about-rules {
      margin-top: 28px;
      list-style: none;
      border: 1px solid var(--line);
      background: rgba(255, 251, 245, 0.55);
    }

    .about-rules li {
      display: grid;
      grid-template-columns: 56px 1fr;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
    }

    .about-rules li:last-child { border-bottom: none; }

    .about-rules span:first-child {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      padding: 12px;
      border-right: 1px solid var(--line);
    }

    .about-rules span:last-child {
      padding: 12px 14px;
    }

    .about-meta {
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* App shell */
    .shell {
      width: min(var(--shell-w), 100%);
      min-height: min(720px, calc(100vh - 80px));
      border: 1px solid rgba(44, 38, 30, calc(0.1 + var(--shell-bg-alpha) * 0.2));
      background: transparent;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 48px rgba(44, 38, 30, calc(var(--shell-bg-alpha) * 0.08));
      isolation: isolate;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: rgba(255, 251, 245, var(--shell-bg-alpha));
      backdrop-filter: blur(var(--shell-blur));
      -webkit-backdrop-filter: blur(var(--shell-blur));
      transition: background 0.2s var(--ease-out), backdrop-filter 0.2s var(--ease-out);
    }

    .shell > * {
      position: relative;
      z-index: 1;
    }

    .shell-tag {
      position: absolute;
      top: -1px;
      right: var(--space-2);
      transform: translateY(-100%);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-bottom: none;
      background: rgba(243, 237, 226, 0.92);
      color: var(--muted);
    }

    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      animation: viewIn 0.35s ease;
    }

    .view.active { display: flex; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app-header {
      flex-shrink: 0;
      padding: var(--space-3) var(--space-2) 14px;
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--line);
    }

    .app-header.back {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-header.back:hover { color: var(--accent); }

    .app-header.back svg {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.2;
    }

    .list-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 88px;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 48px 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-line;
    }

    .empty-state.show { display: block; }

    .note-row {
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: inherit;
      cursor: pointer;
      border: none;
      background:
        linear-gradient(var(--accent), var(--accent)) left / 1px 100% no-repeat,
        linear-gradient(var(--line), var(--line)) bottom / 100% 1px no-repeat,
        transparent;
      padding: 16px 16px 14px 20px;
      transition: background-color 0.15s;
    }

    .note-row:hover { background-color: var(--accent-soft); }

    .note-row:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .note-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
    }

    .note-preview {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .note-review {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .note-review.due { color: var(--due); }

    .btn-delete {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 6px 10px;
      cursor: pointer;
    }

    .btn-delete:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .fab {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 52px;
      height: 52px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: transparent;
      color: var(--accent);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s var(--ease-out), color 0.2s var(--ease-out), transform 0.2s var(--ease-out);
    }

    .fab:hover {
      background: var(--accent);
      color: var(--surface);
      transform: scale(1.03);
    }

    .fab:active {
      transform: scale(0.97);
    }

    .fab:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .form-scroll,
    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .field-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field-label + .field-label,
    .field + .field-label { margin-top: 18px; }

    .field {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      padding: 12px 14px;
      min-height: 44px;
      outline: none;
      resize: vertical;
    }

    .field:focus { border-color: var(--accent); }

    .field::placeholder { color: var(--muted); }

    .field-body { min-height: 160px; }

    .btn-save {
      margin: 0 20px 20px;
      min-height: 48px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      letter-spacing: 0.04em;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-save:hover {
      background: var(--ink);
      color: var(--surface);
    }

    .detail-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 600;
    }

    .detail-rule {
      height: 1px;
      background: var(--line);
      margin: 14px 0 0;
      border: 0;
    }

    .detail-rule.spaced { margin-top: 24px; }

    .detail-body {
      margin-top: 14px;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .timeline-title {
      margin-top: 18px;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
    }

    .timeline-helper {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .timeline-list {
      list-style: none;
      margin-top: 8px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 0 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .timeline-rail {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .timeline-rail::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: -15px;
      width: 1px;
      background: var(--line);
    }

    .timeline-item:last-child .timeline-rail::before { bottom: 50%; }

    .chk {
      position: relative;
      z-index: 1;
      width: 18px;
      height: 18px;
      margin-top: 2px;
      appearance: none;
      border: 1px solid var(--ink);
      background: var(--surface);
      cursor: pointer;
    }

    .chk:checked {
      background:
        linear-gradient(var(--accent), var(--accent)) center / 10px 10px no-repeat;
      border-color: var(--accent);
    }

    .chk:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .chk:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stage-label {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
    }

    .stage-date {
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%) translateY(8px);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .shell-chrome {
      flex-shrink: 0;
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding: 14px var(--space-2) var(--space-2);
      background: transparent;
    }

    .chrome-sliders {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chrome-slider {
      display: grid;
      grid-template-columns: 72px 1fr 2.5rem;
      align-items: center;
      gap: 10px;
      cursor: default;
    }

    .chrome-slider-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--muted);
      line-height: 1.35;
    }

    .chrome-track {
      position: relative;
      height: 6px;
      border: 1px solid var(--line);
      background: rgba(243, 237, 226, 0.45);
    }

    .chrome-track-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, rgba(79, 93, 69, 0.3), rgba(79, 93, 69, 0.52));
      pointer-events: none;
      transition: width 0.12s var(--ease-out);
    }

    .chrome-track input[type="range"] {
      position: absolute;
      inset: -10px 0;
      width: 100%;
      margin: 0;
      cursor: pointer;
      opacity: 0.001;
      height: 28px;
    }

    .chrome-slider-value {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink);
      text-align: right;
    }

    .chrome-slider:focus-within .chrome-track {
      border-color: var(--accent);
    }

    .opacity-control {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      cursor: default;
    }

    .opacity-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
      white-space: nowrap;
    }

    .opacity-bar {
      position: relative;
      height: 6px;
      border: 1px solid var(--line);
      background: rgba(243, 237, 226, 0.5);
    }

    .opacity-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 88%;
      background: linear-gradient(90deg, rgba(79, 93, 69, 0.35), rgba(79, 93, 69, 0.55));
      pointer-events: none;
      transition: width 0.12s var(--ease-out);
    }

    .opacity-bar input[type="range"] {
      position: absolute;
      inset: -10px 0;
      width: 100%;
      margin: 0;
      cursor: pointer;
      opacity: 0.001;
      height: 28px;
    }

    .opacity-value {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink);
      min-width: 2.5rem;
      text-align: right;
    }

    .opacity-control:focus-within .opacity-bar {
      border-color: var(--accent);
    }

    .interval-strip {
      justify-self: start;
      max-width: 280px;
      padding-left: 8px;
    }

    @media (max-width: 960px) {
      .interval-strip { display: none; }
    }

    .interval-strip p {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .interval-days {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border: 1px solid var(--line);
      background: rgba(255, 251, 245, 0.55);
    }

    .interval-days span {
      flex: 1 1 40px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 6px;
      border-right: 1px solid var(--line);
    }

    .interval-days span:last-child { border-right: none; }

    /* —— 背景线条海景 + 点击/随机动效 —— */
    .scene-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.55) 45%,
        rgba(0, 0, 0, 0.85) 78%,
        rgba(0, 0, 0, 0.95) 100%
      );
    }

    .scene-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(243, 237, 226, 0.12) 0%,
        transparent 40%,
        rgba(243, 237, 226, 0.2) 100%
      );
      pointer-events: none;
    }

    .scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      color: var(--line);
    }

    .scene-horizon {
      stroke: var(--line);
      stroke-width: 1;
      opacity: 0.45;
    }

    .scene-sea path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .scene-sea .wave-1 { stroke: var(--line); stroke-width: 1.25; opacity: 0.5; }
    .scene-sea .wave-2 { stroke: var(--accent); stroke-width: 1; opacity: 0.32; }
    .scene-sea .wave-3 { stroke: var(--line); stroke-width: 1; opacity: 0.36; }
    .scene-sea .wave-4 { stroke: var(--muted); stroke-width: 1; opacity: 0.24; }

    .scene-tap-zone {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(42vh, 320px);
      z-index: 0;
      pointer-events: auto;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .scene-tap-zone:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -4px;
    }

    .scene-fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .scene-fish-jump {
      position: fixed;
      width: 30px;
      height: 15px;
      color: var(--ink);
      pointer-events: none;
      z-index: 0;
      --dir: -1;
      transform-origin: 55% 88%;
      animation: fish-jump-once 0.65s var(--ease-out) forwards;
    }

    .scene-fish-jump.to-right {
      --dir: 1;
    }

    .scene-fish-jump.to-right svg {
      transform: scaleX(-1);
    }

    .scene-fish-jump svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.15;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: center;
    }

    .scene-fish-jump svg .fish-eye {
      fill: currentColor;
      stroke: none;
    }

    /* 线稿鱼默认鱼头朝左；位移沿 --dir 与鱼头一致 */
    @keyframes fish-jump-once {
      0% { opacity: 0; transform: translate(0, 0) rotate(calc(var(--dir) * -12deg)) scale(0.85); }
      12% { opacity: 0.85; }
      42% { transform: translate(calc(var(--dir) * 26px), -44px) rotate(calc(var(--dir) * -24deg)) scale(1); }
      72% { opacity: 0.55; transform: translate(calc(var(--dir) * 46px), -10px) rotate(calc(var(--dir) * -6deg)) scale(0.95); }
      100% { opacity: 0; transform: translate(calc(var(--dir) * 58px), 8px) rotate(calc(var(--dir) * 4deg)) scale(0.9); }
    }

    .scene-shell-fall {
      position: fixed;
      width: 34px;
      height: 26px;
      color: var(--accent);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      will-change: transform, opacity;
      animation: shell-drop var(--drop-ms, 2200ms) cubic-bezier(0.33, 0.85, 0.45, 1) forwards;
    }

    .scene-shell-fall svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes shell-drop {
      0% { opacity: 0; transform: translate(0, 0) rotate(var(--spin-start, -12deg)); }
      8% { opacity: 0.65; }
      100% {
        opacity: 0.75;
        transform: translate(var(--drift, 0px), var(--fall, 400px)) rotate(var(--spin-end, 160deg));
      }
    }

    .scene-splash-burst {
      position: fixed;
      width: 36px;
      height: 18px;
      color: var(--line);
      pointer-events: none;
      z-index: 0;
      animation: splash-burst 0.55s var(--ease-out) forwards;
    }

    .scene-splash-burst svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1;
      fill: none;
      stroke-linecap: round;
    }

    @keyframes splash-burst {
      0% { opacity: 0; transform: scale(0.35) translateY(4px); }
      35% { opacity: 0.75; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(1.15) translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene-fish-jump {
        animation: fish-jump-reduce 0.35s ease forwards;
      }

      @keyframes fish-jump-reduce {
        from { opacity: 0; }
        to { opacity: 0.5; }
      }

      .scene-shell-fall,
      .scene-splash-burst {
        animation: none !important;
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; width: 0; height: 0; overflow: hidden">
    <defs>
      <g id="art-scallop" stroke="currentColor" fill="none">
        <path d="M36 52 L8 36 Q4 22 12 12 Q22 4 36 6 Q50 4 60 12 Q68 22 64 36 Z" />
        <path d="M36 52 L36 8" />
        <path d="M36 52 L12 12" />
        <path d="M36 52 L22 8" />
        <path d="M36 52 L50 8" />
        <path d="M36 52 L60 12" />
      </g>
      <g id="art-fish" stroke="currentColor" fill="none">
        <path d="M4 14 C12 6 24 4 34 8 C42 11 44 14 40 16 C30 19 18 18 10 16 C6 15 4 14 4 14 Z" />
        <path d="M40 13 L48 8 M40 15 L48 20 M48 8 L48 20" />
        <path d="M24 5 Q28 7 30 9" />
        <circle class="fish-eye" cx="16" cy="11" r="1.3" />
      </g>
    </defs>
  </svg>

  <div class="scene-bg" aria-hidden="true">
    <svg class="scene-svg" id="scene-svg" viewBox="0 0 1200 320" preserveAspectRatio="none">
      <line class="scene-horizon" x1="0" y1="232" x2="1200" y2="232" />
      <g class="scene-sea" id="scene-sea"></g>
    </svg>
  </div>
  <button type="button" class="scene-tap-zone" id="scene-tap" aria-label="点击海面，小鱼跃起"></button>
  <div class="scene-fx" id="scene-fx" aria-hidden="true"></div>

  <div class="page">
    <aside class="about" aria-label="项目说明">
      <p class="about-eyebrow">NoteSketch</p>
      <h1>记忆笔记</h1>
      <p class="about-lead">
        本页为仓库项目的线条风 Web 界面：免登录、本地笔记，并按艾宾浩斯曲线安排 6 次复习。底部滑条可调背景透明度、海浪高度与起伏；点击海面或等待片刻会有小鱼跃起，偶有小贝壳落入海中。
      </p>
      <ul class="about-rules">
        <li><span>列表</span><span>墨绿左边线、待复习标红、可删除</span></li>
        <li><span>新建</span><span>标题 + 内容，保存后生成复习计划</span></li>
        <li><span>详情</span><span>时间线顺序勾选，不可跳过</span></li>
      </ul>
      <p class="about-meta">com.example.notesketch · 线条预览</p>
    </aside>

    <div class="shell" aria-label="记忆笔记">
      <span class="shell-tag">LINE UI</span>

      <section class="view active" id="view-list">
        <header class="app-header" id="main-header">记忆笔记</header>
        <div class="list-body">
          <div class="empty-state" id="empty-state"></div>
          <div id="note-list"></div>
        </div>
        <button type="button" class="fab" id="fab-add" aria-label="添加笔记">+</button>
      </section>

      <section class="view" id="view-add">
        <header class="app-header back" id="add-header" tabindex="0" role="button">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 L9 12 L15 18" /></svg>
          新建笔记
        </header>
        <div class="form-scroll">
          <label class="field-label" for="input-title" id="label-title">标题</label>
          <input class="field" id="input-title" type="text" maxlength="80" autocomplete="off" />
          <label class="field-label" for="input-content" id="label-content">内容</label>
          <textarea class="field field-body" id="input-content" rows="8"></textarea>
        </div>
        <button type="button" class="btn-save" id="btn-save">保存笔记</button>
      </section>

      <section class="view" id="view-detail">
        <header class="app-header back" id="detail-header" tabindex="0" role="button">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 L9 12 L15 18" /></svg>

        </header>
        <div class="detail-scroll">
          <div class="detail-title" id="detail-title"></div>
          <hr class="detail-rule" />
          <div class="detail-body" id="detail-body"></div>
          <hr class="detail-rule spaced" />
          <div class="timeline-title" id="timeline-title">艾宾浩斯复习时间线</div>
          <p class="timeline-helper" id="timeline-helper">按顺序勾选完成每次复习，不可跳过或取消</p>
          <ul class="timeline-list" id="timeline-list"></ul>
        </div>
      </section>

      <div class="toast" id="toast" role="status"></div>

      <div class="shell-chrome">
        <div class="chrome-sliders">
          <label class="chrome-slider" for="shell-opacity-range">
            <span class="chrome-slider-label">背景透明度</span>
            <div class="chrome-track">
              <div class="chrome-track-fill" id="opacity-fill"></div>
              <input type="range" id="shell-opacity-range" min="0" max="100" value="88" aria-valuemin="0" aria-valuemax="100" aria-valuenow="88" />
            </div>
            <span class="chrome-slider-value" id="shell-opacity-val">88%</span>
          </label>
          <label class="chrome-slider" for="sea-height-range">
            <span class="chrome-slider-label">海浪高度</span>
            <div class="chrome-track">
              <div class="chrome-track-fill" id="sea-height-fill"></div>
              <input type="range" id="sea-height-range" min="0" max="100" value="50" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" />
            </div>
            <span class="chrome-slider-value" id="sea-height-val">50</span>
          </label>
          <label class="chrome-slider" for="sea-amp-range">
            <span class="chrome-slider-label">海浪起伏</span>
            <div class="chrome-track">
              <div class="chrome-track-fill" id="sea-amp-fill"></div>
              <input type="range" id="sea-amp-range" min="0" max="100" value="45" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45" />
            </div>
            <span class="chrome-slider-value" id="sea-amp-val">45</span>
          </label>
        </div>
      </div>
    </div>

    <aside class="interval-strip" aria-hidden="true">
      <p>复习间隔（天）</p>
      <div class="interval-days" id="interval-days"></div>
    </aside>
  </div>

  <script>
    window.SceneTune = {
      bgOpacity: 88,
      seaHeight: 50,
      seaAmp: 45,
    };
  </script>

  <script>
    const NoteSketch = {
      intervalDays: [1, 2, 4, 7, 15, 30],
      strings: {
        mainHeader: "记忆笔记",
        empty: "还没有笔记\n点右下角 +，写下第一条学习笔记",
        addHeader: "新建笔记",
        titleLabel: "标题",
        contentLabel: "内容",
        titleHint: "例如：英语单词 Unit 3",
        contentHint: "笔记内容 / 知识点…",
        save: "保存笔记",
        detailHeader: "复习详情",
        timelineTitle: "艾宾浩斯复习时间线",
        timelineHelper: "按顺序勾选完成每次复习，不可跳过或取消",
        noBody: "（无正文）",
        delete: "删除",
        toastNeedTitle: "请填写标题",
        toastSaved: "已保存",
        finishedAll: "已完成全部复习",
        due: "待复习",
      },
      stageLabel(stage) {
        if (stage >= this.intervalDays.length) return this.strings.finishedAll;
        return `第 ${stage + 1} 次复习 (第 ${this.intervalDays[stage]} 天)`;
      },
      reviewTimeFor(createdAt, stage) {
        if (stage >= this.intervalDays.length) return -1;
        return createdAt + this.intervalDays[stage] * 86400000;
      },
      formatDateTime(timeMs) {
        if (timeMs <= 0) return "—";
        const d = new Date(timeMs);
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const hh = String(d.getHours()).padStart(2, "0");
        const mi = String(d.getMinutes()).padStart(2, "0");
        return `${mm}月${dd}日 ${hh}:${mi}`;
      },
      reviewText(nextReviewTime, finished) {
        if (finished) return this.strings.finishedAll;
        const diff = nextReviewTime - Date.now();
        const dayMs = 86400000;
        if (diff <= 0) return this.strings.due;
        if (diff < dayMs) return `下次复习：今天 ${this.formatDateTime(nextReviewTime)}`;
        if (diff < 2 * dayMs) return "下次复习：明天";
        return `下次复习：${this.formatDateTime(nextReviewTime)}`;
      },
      isDue(nextReviewTime, finished) {
        return !finished && nextReviewTime <= Date.now();
      },
    };

    const STORAGE_KEY = "notesketch-line-ui-v1";
    let notes = loadNotes();
    let nextId = notes.reduce((m, n) => Math.max(m, n.id), 0) + 1;
    let currentNoteId = null;
    let toastTimer = null;

    const els = {
      listView: document.getElementById("view-list"),
      addView: document.getElementById("view-add"),
      detailView: document.getElementById("view-detail"),
      noteList: document.getElementById("note-list"),
      emptyState: document.getElementById("empty-state"),
      fab: document.getElementById("fab-add"),
      titleInput: document.getElementById("input-title"),
      contentInput: document.getElementById("input-content"),
      btnSave: document.getElementById("btn-save"),
      detailTitle: document.getElementById("detail-title"),
      detailBody: document.getElementById("detail-body"),
      timelineList: document.getElementById("timeline-list"),
      toast: document.getElementById("toast"),
    };

    function loadNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      const now = Date.now();
      const day = 86400000;
      const aCreated = now - 2 * day;
      const bCreated = now - 8 * day;
      return [
        {
          id: 1,
          title: "英语单词 Unit 3",
          content: "acquire / retain / recall — 主动回忆比反复阅读更有效。",
          createdAt: aCreated,
          stage: 1,
          nextReviewTime: NoteSketch.reviewTimeFor(aCreated, 1),
          finished: false,
        },
        {
          id: 2,
          title: "艾宾浩斯曲线要点",
          content: "间隔重复：1、2、4、7、15、30 天六个节点。",
          createdAt: bCreated,
          stage: 3,
          nextReviewTime: NoteSketch.reviewTimeFor(bCreated, 3),
          finished: false,
        },
      ];
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 4500);
    }

    function showView(name) {
      els.listView.classList.toggle("active", name === "list");
      els.addView.classList.toggle("active", name === "add");
      els.detailView.classList.toggle("active", name === "detail");
    }

    function sortedNotes() {
      return [...notes].sort((a, b) => a.nextReviewTime - b.nextReviewTime);
    }

    function renderList() {
      const list = sortedNotes();
      els.emptyState.classList.toggle("show", list.length === 0);
      els.noteList.innerHTML = "";

      list.forEach((note) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "note-row";

        const title = document.createElement("div");
        title.className = "note-title";
        title.textContent = note.title;

        const preview = document.createElement("div");
        preview.className = "note-preview";
        preview.textContent = note.content || "";

        const footer = document.createElement("div");
        footer.className = "note-footer";

        const review = document.createElement("div");
        review.className = "note-review";
        review.textContent = NoteSketch.reviewText(note.nextReviewTime, note.finished);
        if (NoteSketch.isDue(note.nextReviewTime, note.finished)) review.classList.add("due");

        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-delete";
        del.textContent = NoteSketch.strings.delete;
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          notes = notes.filter((n) => n.id !== note.id);
          saveNotes();
          renderList();
        });

        footer.append(review, del);
        row.append(title, preview, footer);
        row.addEventListener("click", () => openDetail(note.id));
        els.noteList.appendChild(row);
      });
    }

    function openAdd() {
      els.titleInput.value = "";
      els.contentInput.value = "";
      showView("add");
      setTimeout(() => els.titleInput.focus(), 50);
    }

    function saveNote() {
      const title = els.titleInput.value.trim();
      if (!title) {
        showToast(NoteSketch.strings.toastNeedTitle);
        return;
      }
      const now = Date.now();
      notes.push({
        id: nextId++,
        title,
        content: els.contentInput.value.trim(),
        createdAt: now,
        stage: 0,
        nextReviewTime: NoteSketch.reviewTimeFor(now, 0),
        finished: false,
      });
      saveNotes();
      showToast(NoteSketch.strings.toastSaved);
      renderList();
      showView("list");
    }

    function openDetail(id) {
      const note = notes.find((n) => n.id === id);
      if (!note) {
        showView("list");
        return;
      }
      currentNoteId = id;
      els.detailTitle.textContent = note.title;
      els.detailBody.textContent = note.content || NoteSketch.strings.noBody;
      renderTimeline(note);
      showView("detail");
    }

    function renderTimeline(note) {
      els.timelineList.innerHTML = "";
      const count = NoteSketch.intervalDays.length;

      for (let i = 0; i < count; i++) {
        const li = document.createElement("li");
        li.className = "timeline-item";

        const rail = document.createElement("div");
        rail.className = "timeline-rail";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.className = "chk";
        const done = note.finished || i < note.stage;
        const canCheck = !note.finished && i === note.stage;
        cb.checked = done;
        cb.disabled = !canCheck;
        if (canCheck) {
          cb.addEventListener("change", () => {
            if (cb.checked) completeStage(i);
          });
        }
        rail.appendChild(cb);

        const meta = document.createElement("div");
        const label = document.createElement("div");
        label.className = "stage-label";
        label.textContent = NoteSketch.stageLabel(i);
        const date = document.createElement("div");
        date.className = "stage-date";
        date.textContent = `计划：${NoteSketch.formatDateTime(NoteSketch.reviewTimeFor(note.createdAt, i))}`;
        meta.append(label, date);

        li.append(rail, meta);
        els.timelineList.appendChild(li);
      }
    }

    function completeStage(index) {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note || note.finished || index !== note.stage) {
        if (note) renderTimeline(note);
        return;
      }
      const nextStage = note.stage + 1;
      const nextTime = NoteSketch.reviewTimeFor(note.createdAt, nextStage);
      note.stage = nextStage;
      note.nextReviewTime = nextTime;
      note.finished = nextTime < 0;
      saveNotes();
      renderTimeline(note);
      renderList();
    }

    function bindChrome() {
      document.getElementById("main-header").textContent = NoteSketch.strings.mainHeader;
      els.emptyState.textContent = NoteSketch.strings.empty;
      document.getElementById("label-title").textContent = NoteSketch.strings.titleLabel;
      document.getElementById("label-content").textContent = NoteSketch.strings.contentLabel;
      els.titleInput.placeholder = NoteSketch.strings.titleHint;
      els.contentInput.placeholder = NoteSketch.strings.contentHint;
      els.btnSave.textContent = NoteSketch.strings.save;
      document.getElementById("timeline-title").textContent = NoteSketch.strings.timelineTitle;
      document.getElementById("timeline-helper").textContent = NoteSketch.strings.timelineHelper;

      const strip = document.getElementById("interval-days");
      NoteSketch.intervalDays.forEach((d) => {
        const span = document.createElement("span");
        span.textContent = d;
        strip.appendChild(span);
      });
    }

    function bindBack(el, onBack) {
      el.addEventListener("click", onBack);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          onBack();
        }
      });
    }

    bindBack(document.getElementById("add-header"), () => showView("list"));
    bindBack(document.getElementById("detail-header"), () => {
      renderList();
      showView("list");
    });

    els.fab.addEventListener("click", openAdd);
    els.btnSave.addEventListener("click", saveNote);

    bindChrome();
    renderList();
    showView("list");

    (function initChromeSliders() {
      const shell = document.querySelector(".shell");
      if (!shell) return;

      const store = {
        bg: "notesketch-shell-opacity-v2",
        height: "notesketch-sea-height-v1",
        amp: "notesketch-sea-amp-v1",
      };

      function readInt(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (raw != null) return parseInt(raw, 10);
        } catch (_) {}
        return fallback;
      }

      function bindSlider(id, fillId, valId, key, tuneKey, format) {
        const range = document.getElementById(id);
        const fill = document.getElementById(fillId);
        const valEl = document.getElementById(valId);
        if (!range || !fill || !valEl) return;

        function apply(pct) {
          const p = Math.min(100, Math.max(0, pct));
          window.SceneTune[tuneKey] = p;
          fill.style.width = `${p}%`;
          valEl.textContent = format(p);
          range.value = String(p);
          range.setAttribute("aria-valuenow", String(p));
          try {
            localStorage.setItem(key, String(p));
          } catch (_) {}
        }

        apply(readInt(key, window.SceneTune[tuneKey]));
        range.addEventListener("input", () => apply(parseInt(range.value, 10)));
      }

      function applyBg(pct) {
        const p = Math.min(100, Math.max(0, pct));
        window.SceneTune.bgOpacity = p;
        const alpha = p / 100;
        shell.style.setProperty("--shell-bg-alpha", alpha.toFixed(2));
        shell.style.setProperty("--shell-blur", `${Math.round(alpha * 14)}px`);
        const fill = document.getElementById("opacity-fill");
        const valEl = document.getElementById("shell-opacity-val");
        const range = document.getElementById("shell-opacity-range");
        if (fill) fill.style.width = `${p}%`;
        if (valEl) valEl.textContent = `${p}%`;
        if (range) {
          range.value = String(p);
          range.setAttribute("aria-valuenow", String(p));
        }
        try {
          localStorage.setItem(store.bg, String(p));
        } catch (_) {}
      }

      applyBg(readInt(store.bg, window.SceneTune.bgOpacity));
      document.getElementById("shell-opacity-range")?.addEventListener("input", (e) => {
        applyBg(parseInt(e.target.value, 10));
      });

      bindSlider("sea-height-range", "sea-height-fill", "sea-height-val", store.height, "seaHeight", (p) => String(p));
      bindSlider("sea-amp-range", "sea-amp-fill", "sea-amp-val", store.amp, "seaAmp", (p) => String(p));
    })();
  </script>

  <script>
    (function initLineSea() {
      const sea = document.getElementById("scene-sea");
      const fx = document.getElementById("scene-fx");
      const tap = document.getElementById("scene-tap");
      const sceneBg = document.querySelector(".scene-bg");
      const horizonEl = document.querySelector(".scene-horizon");
      if (!sea || !fx) return;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const W = 1200;
      const layers = [
        { cls: "wave-1", baseY: 246, amp: 9, freq: 0.011, speed: 0.32 },
        { cls: "wave-2", baseY: 266, amp: 12, freq: 0.0085, speed: 0.26 },
        { cls: "wave-3", baseY: 286, amp: 7, freq: 0.014, speed: 0.38 },
        { cls: "wave-4", baseY: 306, amp: 5, freq: 0.017, speed: 0.2 },
      ];

      const paths = layers.map((layer) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("class", layer.cls);
        sea.appendChild(p);
        return { el: p, ...layer };
      });

      function wavePath(baseY, amp, freq, phase) {
        const step = 16;
        let d = `M 0 ${baseY}`;
        for (let x = 0; x <= W; x += step) {
          const y = baseY + Math.sin(x * freq + phase) * amp;
          d += ` L ${x} ${y.toFixed(1)}`;
        }
        return d;
      }

      function seaWaveParams() {
        const h = window.SceneTune?.seaHeight ?? 50;
        const a = window.SceneTune?.seaAmp ?? 45;
        const yOff = ((50 - h) / 50) * 58;
        const ampMul = 0.15 + (a / 100) * 1.85;
        return { yOff, ampMul };
      }

      function redrawWaves(t = 0) {
        const { yOff, ampMul } = seaWaveParams();
        paths.forEach(({ el, baseY, amp, freq, speed }) => {
          el.setAttribute("d", wavePath(baseY + yOff, amp * ampMul, freq, t * speed * Math.PI * 2));
        });
        if (horizonEl) {
          const hy = 232 + yOff;
          horizonEl.setAttribute("y1", String(hy));
          horizonEl.setAttribute("y2", String(hy));
        }
      }

      function getSeaSurfaceY() {
        const { yOff } = seaWaveParams();
        if (!sceneBg) return window.innerHeight * 0.72;
        const r = sceneBg.getBoundingClientRect();
        const ratio = (232 + yOff) / 320;
        return r.top + r.height * ratio;
      }

      function fishSvgMarkup() {
        return `<svg viewBox="0 0 52 22" aria-hidden="true"><use href="#art-fish" transform="translate(0,1) scale(1.05)" /></svg>`;
      }

      function shellSvgMarkup() {
        return `<svg viewBox="0 0 72 58" aria-hidden="true"><use href="#art-scallop" /></svg>`;
      }

      function splashSvgMarkup() {
        return `<svg viewBox="0 0 36 18" aria-hidden="true">
          <path d="M4 14 Q8 4 12 10 Q16 4 20 14" />
          <path d="M12 10 L12 2 M8 8 L6 4 M16 8 L18 4" />
        </svg>`;
      }

      function spawnFish(clientX) {
        const seaY = getSeaSurfaceY();
        const fish = document.createElement("div");
        const toRight = Math.random() > 0.5;
        fish.className = "scene-fish-jump" + (toRight ? " to-right" : "");
        fish.style.left = `${clientX - 15}px`;
        fish.style.top = `${seaY - 10}px`;
        fish.innerHTML = fishSvgMarkup();
        fx.appendChild(fish);
        fish.addEventListener("animationend", () => fish.remove(), { once: true });
        setTimeout(() => fish.remove(), 800);
      }

      function spawnSplash(x, y) {
        const splash = document.createElement("div");
        splash.className = "scene-splash-burst";
        splash.style.left = `${x - 18}px`;
        splash.style.top = `${y - 14}px`;
        splash.innerHTML = splashSvgMarkup();
        fx.appendChild(splash);
        splash.addEventListener("animationend", () => splash.remove(), { once: true });
      }

      function dropShell() {
        const margin = 24;
        const sizeW = 34;
        const startX = margin + Math.random() * (window.innerWidth - margin * 2 - sizeW);
        const zoneTop = window.innerHeight * (0.04 + Math.random() * 0.22);
        const seaY = getSeaSurfaceY();
        const fallPx = Math.max(seaY - zoneTop - 8, 120);
        const drift = (Math.random() - 0.5) * 48;
        const dropMs = Math.round(1600 + fallPx * 1.35 + Math.random() * 400);

        const shell = document.createElement("div");
        shell.className = "scene-shell-fall";
        shell.style.left = `${startX}px`;
        shell.style.top = `${zoneTop}px`;
        shell.style.setProperty("--fall", `${fallPx}px`);
        shell.style.setProperty("--drift", `${drift}px`);
        shell.style.setProperty("--drop-ms", `${dropMs}ms`);
        shell.style.setProperty("--spin-start", `${-20 + Math.random() * 40}deg`);
        shell.style.setProperty("--spin-end", `${120 + Math.random() * 120}deg`);
        shell.innerHTML = shellSvgMarkup();
        fx.appendChild(shell);

        shell.addEventListener(
          "animationend",
          () => {
            const impactX = startX + drift + sizeW / 2;
            spawnSplash(impactX, seaY - 4);
            shell.remove();
          },
          { once: true }
        );
      }

      function scheduleRandomFish() {
        if (reduceMotion) return;
        const wait = 6000 + Math.random() * 11000;
        setTimeout(() => {
          const x = 48 + Math.random() * (window.innerWidth - 96);
          spawnFish(x);
          scheduleRandomFish();
        }, wait);
      }

      function scheduleShellDrop() {
        if (reduceMotion) return;
        const wait = 9000 + Math.random() * 15000;
        setTimeout(() => {
          dropShell();
          scheduleShellDrop();
        }, wait);
      }

      if (tap) {
        tap.addEventListener("click", (e) => {
          spawnFish(e.clientX);
        });
        tap.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            const r = tap.getBoundingClientRect();
            spawnFish(r.left + r.width / 2);
          }
        });
      }

      if (reduceMotion) {
        redrawWaves(0);
        ["sea-height-range", "sea-amp-range"].forEach((id) => {
          document.getElementById(id)?.addEventListener("input", () => redrawWaves(0));
        });
      } else {
        let raf = 0;
        let t0 = 0;

        function frame(ts) {
          if (!t0) t0 = ts;
          const t = (ts - t0) * 0.001;
          redrawWaves(t);
          raf = requestAnimationFrame(frame);
        }

        raf = requestAnimationFrame(frame);

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            cancelAnimationFrame(raf);
            raf = 0;
            t0 = 0;
          } else if (!raf) {
            raf = requestAnimationFrame(frame);
          }
        });

        scheduleShellDrop();
        scheduleRandomFish();
        setTimeout(dropShell, 4000 + Math.random() * 3000);
      }
    })();
  </script>
</body>
</html>
