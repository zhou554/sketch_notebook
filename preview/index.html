<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记忆笔记 · 拼贴手账 · 森林狐狸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f6f0e4;
      --grid: #ddd5c8;
      --ink: #3d3428;
      --muted: #7a6f62;
      --wood: #5c4030;
      --wood-light: #7a5844;
      --tape-teal: #7aab9e;
      --tape-orange: #e8a56a;
      --fox: #c45c2a;
      --due: #b03a32;
      --sticker-yellow: #fff3c4;
      --sticker-pink: #ffe4ec;
      --font-hand: "Patrick Hand", "Caveat", cursive;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --spread-w: 390px;
      --phone-ratio-w: 9;
      --phone-ratio-h: 16;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Hide all scrollbars inside the phone mock / app; keep scroll working */
    .spread,
    .spread *,
    .desk,
    .desk * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .spread::-webkit-scrollbar,
    .spread *::-webkit-scrollbar,
    .desk::-webkit-scrollbar,
    .desk *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
      background: transparent !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--ink);
      line-height: 1.5;
      background: #3a2e26;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 12px;
      -webkit-font-smoothing: antialiased;
    }

    .desk {
      width: min(var(--spread-w), 100%);
      padding: 14px;
      background: linear-gradient(145deg, #4a3828 0%, #3a2e26 100%);
      border-radius: 4px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    .spread {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: min(
        calc(var(--spread-w) * var(--phone-ratio-h) / var(--phone-ratio-w)),
        calc(100vh - 32px)
      );
      max-height: min(
        calc(var(--spread-w) * var(--phone-ratio-h) / var(--phone-ratio-w)),
        calc(100vh - 32px)
      );
      min-height: 0;
      background-color: var(--cream);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 18px 18px;
      overflow: hidden;
      border: 2px solid rgba(92, 64, 48, 0.25);
    }

    .collage-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .tape {
      position: absolute;
      opacity: 0.88;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .tape-v {
      width: 28px;
      height: 110px;
      top: 48px;
      left: 6px;
      background: repeating-linear-gradient(
        180deg,
        var(--tape-orange),
        var(--tape-orange) 8px,
        rgba(255, 255, 255, 0.35) 8px,
        rgba(255, 255, 255, 0.35) 10px
      );
      transform: rotate(-4deg);
    }

    .tape-h {
      width: 100px;
      height: 22px;
      top: 12px;
      right: 72px;
      background: var(--tape-teal);
      transform: rotate(2deg);
      border-radius: 1px;
    }

    .tape-h::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px);
      background-size: 6px 6px;
    }

    .ribbon {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) rotate(-0.8deg);
      z-index: 2;
      padding: 8px 36px 10px;
      background: var(--tape-orange);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 1.45rem;
      letter-spacing: 0.06em;
      box-shadow: 0 2px 0 rgba(92, 64, 48, 0.2);
      clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
    }

    .side-board {
      position: absolute;
      top: 100px;
      right: 8px;
      width: 52px;
      padding: 12px 6px;
      background: linear-gradient(180deg, var(--wood-light), var(--wood));
      border: 2px solid #3d2818;
      border-radius: 3px;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.15);
      transform: rotate(1.5deg);
      z-index: 1;
    }

    .side-board p {
      font-family: var(--font-hand);
      font-size: 0.85rem;
      color: #f6e8dc;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .side-board .days {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .side-board .days span {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #ffe8d4;
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 6px;
      border-radius: 2px;
    }

    .scatter {
      position: absolute;
      color: var(--muted);
      opacity: 0.45;
    }

    .scatter-1 { top: 200px; left: 24px; width: 20px; }
    .scatter-2 { top: 320px; right: 68px; width: 16px; }
    .scatter-3 { bottom: 140px; left: 40px; width: 18px; }

    .side-fox {
      position: absolute;
      z-index: 2;
      width: clamp(56px, 18vw, 72px);
      height: auto;
      opacity: 0.9;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 2px 5px rgba(61, 52, 40, 0.14));
    }

    .side-fox--left {
      left: 4px;
      top: 36%;
      transform: rotate(-10deg);
    }

    .side-fox--right {
      right: 58px;
      top: 54%;
      transform: rotate(8deg) scaleX(-1);
    }

    .side-fox--left-alt {
      left: 8px;
      top: 62%;
      width: clamp(44px, 14vw, 56px);
      opacity: 0.72;
      transform: rotate(6deg);
    }

    .side-fox--right-alt {
      right: 64px;
      top: 28%;
      width: clamp(44px, 14vw, 56px);
      opacity: 0.72;
      transform: rotate(-6deg) scaleX(-1);
    }

    .forest-peep {
      position: absolute;
      z-index: 2;
      bottom: 0;
      width: 46%;
      height: 21%;
      max-height: 118px;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    .forest-peep--left {
      left: 0;
    }

    .forest-peep--right {
      right: 0;
    }

    .forest-peep img {
      position: absolute;
      bottom: 0;
      height: 100%;
      width: auto;
      max-width: none;
      opacity: 0.88;
      filter: drop-shadow(0 -1px 4px rgba(45, 70, 55, 0.08));
    }

    .forest-peep--left img {
      left: 0;
    }

    .forest-peep--right img {
      right: 0;
    }

    .app-layer {
      position: relative;
      z-index: 3;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      animation: viewIn 0.35s var(--ease);
    }

    .view.active { display: flex; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #view-list {
      background: transparent;
      overflow: hidden;
    }

    #view-list.active {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #view-add.active {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background-color: var(--sticker-yellow);
      background-image:
        linear-gradient(rgba(122, 111, 98, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 111, 98, 0.12) 1px, transparent 1px);
      background-size: 18px 18px;
      box-shadow:
        inset 0 0 0 2px rgba(61, 52, 40, 0.08),
        inset 0 0 0 6px rgba(255, 255, 255, 0.45);
    }

    #view-detail.active {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background-color: var(--cream);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .detail-bloom-corner {
      position: absolute;
      right: -36px;
      bottom: -28px;
      width: clamp(140px, 40%, 170px);
      height: auto;
      z-index: 6;
      pointer-events: none;
      user-select: none;
      opacity: 0.9;
      transform-origin: 100% 100%;
      transform: rotate(18deg);
      filter: drop-shadow(0 2px 6px rgba(61, 52, 40, 0.12));
    }

    .add-back {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 52px 16px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--ink);
      font: inherit;
      text-align: left;
    }

    .add-back-label {
      font-family: var(--font-hand);
      font-size: 1.05rem;
      color: var(--muted);
    }

    .add-back svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
      flex-shrink: 0;
    }

    .add-editor {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 20px 28px 24px;
    }

    .add-editor__title {
      flex-shrink: 0;
      width: 100%;
      border: none;
      border-bottom: 2px dashed rgba(122, 111, 98, 0.35);
      background: transparent;
      font-family: var(--font-hand);
      font-size: clamp(1.35rem, 4vw, 1.65rem);
      color: var(--ink);
      padding: 4px 2px 12px;
      outline: none;
    }

    .add-editor__title:focus {
      border-bottom-color: var(--tape-teal);
    }

    .add-editor__title::placeholder {
      color: rgba(122, 111, 98, 0.55);
    }

    .add-editor__body {
      flex: 1;
      min-height: 0;
      width: 100%;
      margin-top: 12px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink);
      padding: 4px 2px;
      resize: none;
      outline: none;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .add-editor__body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .add-editor__body::placeholder {
      color: rgba(122, 111, 98, 0.5);
    }

    #view-add .field-hint {
      position: absolute;
      left: 24px;
      bottom: 16px;
      right: 24px;
      margin: 0;
    }

    .journal-frame {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      margin: 72px 10px 10px;
      border: 2px solid rgba(92, 64, 48, 0.22);
      border-radius: 12px;
      background: transparent;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      overflow: hidden;
    }

    .journal-foot {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: 2px 8px 10px;
      background: transparent;
      z-index: 12;
    }

    .scrollbar-hidden {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .scrollbar-hidden::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .list-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 24px 12px;
      background: transparent;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .list-scroll::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .list-scroll.is-pulling .pull-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .pull-hint {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      margin-top: 8px;
      padding: 8px 12px;
      text-align: center;
      font-family: var(--font-hand);
      font-size: 1rem;
      color: var(--muted);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
    }

    .pull-hint.ready {
      color: var(--fox);
    }

    #note-list {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 4px 4px 8px;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 32px 16px;
      font-family: var(--font-hand);
      font-size: 1.25rem;
      color: var(--muted);
      white-space: pre-line;
      line-height: 1.6;
    }

    .empty.show { display: block; }

    .note-sticker {
      display: block;
      width: calc(100% - 4px);
      max-width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 2px solid rgba(61, 52, 40, 0.32);
      padding: 14px 14px 12px;
      margin-bottom: 12px;
      position: relative;
      flex-shrink: 0;
      scroll-snap-align: none;
      background: var(--sticker-yellow);
      box-shadow:
        1px 2px 0 rgba(255, 255, 255, 0.85) inset,
        2px 5px 0 rgba(61, 52, 40, 0.1),
        0 8px 20px rgba(61, 52, 40, 0.14);
      outline: 2px solid rgba(255, 255, 255, 0.92);
      outline-offset: -1px;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .note-sticker:nth-child(even) {
      background: var(--sticker-pink);
    }

    .note-sticker:hover {
      box-shadow:
        1px 2px 0 rgba(255, 255, 255, 0.85) inset,
        3px 6px 0 rgba(61, 52, 40, 0.12),
        0 14px 28px rgba(61, 52, 40, 0.18);
    }

    .note-sticker.note-sticker--new {
      animation: noteLand 0.45s var(--ease);
    }

    @keyframes noteLand {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .note-sticker:focus-visible {
      outline: 3px solid var(--tape-teal);
      outline-offset: 2px;
    }

    .note-sticker h3 {
      font-family: var(--font-hand);
      font-size: 1.25rem;
    }

    .note-sticker .preview {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-sticker .meta {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .note-sticker .when {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }

    .note-sticker .when.due { color: var(--due); font-weight: 500; }

    .btn-tear {
      font-family: var(--font-hand);
      font-size: 1rem;
      border: 1px dashed var(--muted);
      background: rgba(255, 255, 255, 0.4);
      padding: 2px 8px;
      cursor: pointer;
      color: var(--muted);
    }

    .btn-tear:hover { color: var(--ink); border-color: var(--ink); }

    .fab-fox {
      position: relative;
      left: auto;
      bottom: auto;
      transform: none;
      z-index: 12;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.12));
      transition: transform 0.2s var(--ease);
      pointer-events: auto;
    }

    .fab-fox .sticker-wrap {
      display: block;
      padding: 0;
      background: transparent;
    }

    .fab-fox img {
      width: 52px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .fab-fox:hover { transform: translateY(-3px) scale(1.03); }
    .fab-fox:active { transform: scale(0.98); }

    .fab-fox:focus-visible {
      outline: 2px solid var(--tape-teal);
      outline-offset: 4px;
    }

    .fab-fox .fab-label {
      display: block;
      font-family: var(--font-hand);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      margin-top: 2px;
    }

    .panel-head h2 {
      font-family: var(--font-hand);
      font-size: 1.4rem;
    }

    .panel-head .panel-sub {
      font-family: var(--font-hand);
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: normal;
      margin-top: 2px;
    }

    .panel-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 56px 16px 12px;
      cursor: pointer;
    }

    .panel-head:hover { color: var(--wood); }

    .panel-head svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
    }

    .panel-head-text {
      display: flex;
      flex-direction: column;
    }

    .panel-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 56px 24px 20px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .panel-scroll::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .form-sticker {
      background: var(--sticker-yellow);
      border: 2px solid rgba(61, 52, 40, 0.3);
      outline: 3px solid #fff;
      padding: 16px;
      filter: drop-shadow(2px 3px 0 rgba(61, 52, 40, 0.1));
      transform: rotate(-0.4deg);
    }

    .field-label {
      font-family: var(--font-hand);
      font-size: 1.15rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .field-label + .field-label { margin-top: 14px; }

    .field {
      width: 100%;
      border: none;
      border-bottom: 2px dashed rgba(122, 111, 98, 0.5);
      background: transparent;
      font-size: 15px;
      font-family: inherit;
      padding: 8px 4px;
      outline: none;
    }

    .field:focus { border-bottom-color: var(--tape-teal); }

    .field-area {
      min-height: 160px;
      resize: none;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .field-area::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .btn-save {
      margin: 16px 20px 24px;
      align-self: flex-start;
      padding: 10px 24px;
      font-family: var(--font-hand);
      font-size: 1.15rem;
      border: 2px solid var(--ink);
      background: #fff;
      cursor: pointer;
      transform: rotate(-0.5deg);
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.08));
    }

    .btn-save:hover {
      background: var(--tape-teal);
      border-color: var(--tape-teal);
      color: #fff;
    }

    .detail-paper {
      height: 340px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fffef8;
      border: 2px solid rgba(61, 52, 40, 0.25);
      outline: 3px solid #fff;
      padding: 16px;
      filter: drop-shadow(2px 4px 0 rgba(61, 52, 40, 0.1));
      cursor: text;
    }

    .detail-paper h3 {
      font-family: var(--font-hand);
      font-size: 1.35rem;
      flex-shrink: 0;
    }

    .detail-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-body {
      flex: 1;
      min-height: 0;
      margin-top: 12px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .detail-body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .detail-edit-hint {
      flex-shrink: 0;
      margin-top: 10px;
      font-family: var(--font-hand);
      font-size: 0.9rem;
      color: rgba(122, 111, 98, 0.6);
    }

    .detail-paper.is-editing .detail-view { display: none; }
    .detail-paper.is-editing .detail-edit { display: flex; }
    .detail-edit {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    .detail-edit input,
    .detail-edit-body {
      width: 100%;
      border: none;
      background: transparent;
      font: inherit;
      color: var(--ink);
      outline: none;
    }
    .detail-edit input {
      flex-shrink: 0;
      font-family: var(--font-hand);
      font-size: 1.35rem;
      border-bottom: 2px dashed rgba(122, 111, 98, 0.35);
      padding-bottom: 8px;
    }
    .detail-edit-body {
      flex: 1;
      min-height: 0;
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .detail-edit-body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .detail-edit-body:empty::before {
      content: attr(data-placeholder);
      color: rgba(122, 111, 98, 0.45);
      pointer-events: none;
    }
    .detail-save {
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 2px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      line-height: 0;
      filter: drop-shadow(0 1px 3px rgba(61, 52, 40, 0.16));
      transition: transform 0.18s var(--ease);
    }
    .detail-save:hover {
      transform: scale(1.06) rotate(-4deg);
    }
    .detail-save:active {
      transform: scale(0.96);
    }
    .detail-save img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .timeline-block {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 2px dotted rgba(122, 111, 98, 0.45);
    }

    .timeline-block h4 {
      font-family: var(--font-hand);
      font-size: 0.95rem;
    }

    .timeline-block .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .ebbing-axis {
      position: relative;
      margin-top: 18px;
      padding: 8px 4px 28px;
      user-select: none;
      overflow: visible;
    }
    .ebbing-boxes {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 2px;
    }
    .ebbing-box {
      width: 18px;
      height: 18px;
      border: 1.6px solid #c4b8a8;
      border-radius: 3px;
      background: rgba(255,255,255,0.7);
      cursor: default;
      padding: 0;
      appearance: none;
      position: relative;
    }
    .ebbing-box.done {
      background: var(--tape-teal);
      border-color: #5c8f82;
    }
    .ebbing-box.done::after {
      content: "";
      position: absolute;
      left: 4px; top: 2px;
      width: 5px; height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .ebbing-box.current {
      border-color: #6a9fd4;
      background: #fff;
      cursor: pointer;
    }
    .ebbing-box:disabled:not(.done):not(.current) { opacity: 0.55; }

    .ebbing-track {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: #e8e2d8;
      margin: 10px 6px 0;
      overflow: visible;
    }
    .ebbing-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #c9b8f0 0%, #8bb4e8 55%, #6a9fd4 100%);
    }
    .ebbing-fox {
      position: absolute;
      top: 50%;
      width: 80px;
      height: 80px;
      margin-top: -40px;
      margin-left: -40px;
      left: 0%;
      object-fit: contain;
      filter: drop-shadow(0 1px 3px rgba(61,52,40,0.18));
      pointer-events: none;
      transition: left 0.35s var(--ease);
      z-index: 2;
    }
    .ebbing-ticks {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .ebbing-ticks span {
      width: 2px;
      height: 14px;
      margin-top: -2px;
      background: #b8aea0;
    }
    .ebbing-days {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      padding: 0 2px;
    }
    .ebbing-days span {
      width: 28px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink);
      line-height: 1.2;
    }
    .ebbing-days small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .field-hint {
      margin: 8px 20px 0 56px;
      font-family: var(--font-hand);
      font-size: 1rem;
      color: var(--due);
      min-height: 1.25em;
      visibility: hidden;
    }

    .field-hint.show { visibility: visible; }

    @media (max-width: 400px) {
      .side-board { width: 44px; right: 4px; }
      .list-scroll { padding: 10px 44px 12px 24px; }
      .panel-scroll { padding-right: 52px; }
      .ribbon { font-size: 1.25rem; padding-inline: 28px; }
    }
  </style>
</head>
<body>
  <div class="desk">
    <div class="spread" aria-label="记忆笔记手账页">
      <div class="collage-deco" aria-hidden="true">
        <div class="tape tape-v"></div>
        <div class="tape tape-h"></div>

        <aside class="side-board">
          <p>复习<br />间隔</p>

      <img

      <img

                <div
                  id="detail-edit-body"

              <p class="hint" id="timeline-helper" hidden></p>

              <ul class="timeline-list" id="timeline-list" hidden></ul>

            class="detail-bloom-corner"

            width="168"

            alt=""
            decoding="async"

      </div>

  </div>

  <script>
    const NoteSketch = {
      intervalDays: [1, 2, 4, 7, 15, 30],
      strings: {
        empty: "这一页还空着\n点下方狐狸，或滑到底后上拉按住\n进入新建页编辑便签",
        pullHint: "滑到底后，继续上拉并按住片刻",
        pullHintProgress: "继续按住…",
        pullHintReady: "即将进入新建页…",
        titleHint: "例如：英语单词 Unit 3",
        contentHint: "笔记内容 / 知识点…",
        untitled: "无标题",
        finishedAll: "已完成全部复习",
        due: "待复习",
        noBody: "（无正文）",
        delete: "撕掉",
      },
      stageLabel(stage) {
        if (stage >= this.intervalDays.length) return this.strings.finishedAll;
        return `第 ${stage + 1} 次复习 (第 ${this.intervalDays[stage]} 天)`;
      },
      reviewTimeFor(createdAt, stage) {
        if (stage >= this.intervalDays.length) return -1;
        return createdAt + this.intervalDays[stage] * 86400000;
      },
      formatDateTime(timeMs) {
        if (timeMs <= 0) return "—";
        const d = new Date(timeMs);
        return `${String(d.getMonth() + 1).padStart(2, "0")}月${String(d.getDate()).padStart(2, "0")}日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      },
      reviewText(nextReviewTime, finished) {
        if (finished) return this.strings.finishedAll;
        const diff = nextReviewTime - Date.now();
        const dayMs = 86400000;
        if (diff <= 0) return this.strings.due;
        if (diff < dayMs) return `下次：今天 ${this.formatDateTime(nextReviewTime)}`;
        if (diff < 2 * dayMs) return "下次：明天";
        return `下次：${this.formatDateTime(nextReviewTime)}`;
      },
      isDue(nextReviewTime, finished) {
        return !finished && nextReviewTime <= Date.now();
      },
    };

    const STORAGE_KEY = "notesketch-scrapbook-forest-v1";
    let notes = loadNotes();
    let nextId = notes.reduce((m, n) => Math.max(m, n.id), 0) + 1;
    let currentNoteId = null;
    let hintTimer = null;
    let resetListPullState = () => {};

    const els = {
      listView: document.getElementById("view-list"),
      addView: document.getElementById("view-add"),
      detailView: document.getElementById("view-detail"),
      detailPaper: document.getElementById("detail-paper"),
      detailEditTitle: document.getElementById("detail-edit-title"),
      detailEditBody: document.getElementById("detail-edit-body"),
      detailSave: document.getElementById("detail-save"),
      listScroll: document.getElementById("list-scroll"),
      pullHint: document.getElementById("pull-hint"),
      noteList: document.getElementById("note-list"),
      emptyState: document.getElementById("empty-state"),
      fab: document.getElementById("fab-fox"),
      titleInput: document.getElementById("input-title"),
      contentInput: document.getElementById("input-content"),
      fieldHint: document.getElementById("field-hint"),
      detailTitle: document.getElementById("detail-title"),
      detailBody: document.getElementById("detail-body"),
      timelineList: document.getElementById("timeline-list"),
      ebbingAxis: document.getElementById("ebbing-axis"),
    };

    function loadNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      const now = Date.now();
      const day = 86400000;
      const aCreated = now - 2 * day;
      const bCreated = now - 8 * day;
      return [
        {
          id: 1,
          title: "英语单词 Unit 3",
          content: "acquire / retain / recall — 主动回忆比反复阅读更有效。",
          createdAt: aCreated,
          stage: 1,
          nextReviewTime: NoteSketch.reviewTimeFor(aCreated, 1),
          finished: false,
        },
        {
          id: 2,
          title: "艾宾浩斯曲线要点",
          content: "间隔重复：1、2、4、7、15、30 天六个节点。",
          createdAt: bCreated,
          stage: 3,
          nextReviewTime: NoteSketch.reviewTimeFor(bCreated, 3),
          finished: false,
        },
      ];
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function showFieldHint(msg) {
      els.fieldHint.textContent = msg;
      els.fieldHint.classList.add("show");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => els.fieldHint.classList.remove("show"), 3200);
    }

    function showView(name) {
      els.listView.classList.toggle("active", name === "list");
      els.addView.classList.toggle("active", name === "add");
      els.detailView.classList.toggle("active", name === "detail");
    }

    function sortedNotes() {
      return [...notes].sort((a, b) => a.createdAt - b.createdAt);
    }

    const tilts = [-0.45, 0.35, -0.3, 0.4, -0.35, 0.25];
    const shifts = [0, 4, -3, 5, -4, 2];
    let afterListRender = () => {};

    function renderList(highlightId = null) {
      const list = sortedNotes();
      els.emptyState.classList.toggle("show", list.length === 0);
      els.emptyState.textContent = NoteSketch.strings.empty;
      els.noteList.innerHTML = "";

      list.forEach((note, i) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "note-sticker";
        if (note.id === highlightId) card.classList.add("note-sticker--new");
        card.dataset.noteId = String(note.id);
        const tilt = tilts[i % tilts.length];
        const shift = shifts[i % shifts.length];
        card.style.transform = `rotate(${tilt}deg) translateX(${shift}px)`;

        const h3 = document.createElement("h3");
        h3.textContent = note.title;

        const preview = document.createElement("div");
        preview.className = "preview";
        preview.textContent = note.content || "";

        const meta = document.createElement("div");
        meta.className = "meta";

        const when = document.createElement("span");
        when.className = "when";
        when.textContent = NoteSketch.reviewText(note.nextReviewTime, note.finished);
        if (NoteSketch.isDue(note.nextReviewTime, note.finished)) when.classList.add("due");

        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-tear";
        del.textContent = NoteSketch.strings.delete;
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          notes = notes.filter((n) => n.id !== note.id);
          saveNotes();
          renderList();
        });

        meta.append(when, del);
        card.append(h3, preview, meta);
        card.addEventListener("click", () => openDetail(note.id));
        els.noteList.appendChild(card);
      });
      afterListRender();
    }

    function getListMaxScroll() {
      const el = els.listScroll;
      return Math.max(0, el.scrollHeight - el.clientHeight);
    }

    function scrollListToBottom() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const max = getListMaxScroll();
          els.listScroll.scrollTo({ top: max, behavior: "auto" });
        });
      });
    }

    function isListAtBottom() {
      const el = els.listScroll;
      return el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
    }

    function initListPageScroll() {
      afterListRender = () => {};
    }

    function initListPullToAdd() {
      const el = els.listScroll;
      const hint = els.pullHint;
      const MIN_PULL = 48;
      const HOLD_MS = 700;
      const COOLDOWN = 800;
      const WHEEL_GAP_MS = 150;
      let touchStartY = 0;
      let pullDistance = 0;
      let holdStartAt = 0;
      let lastTrigger = 0;
      let wheelAcc = 0;
      let lastWheelAt = 0;
      let holdArmed = false;

      function resetPull() {
        pullDistance = 0;
        wheelAcc = 0;
        holdStartAt = 0;
        holdArmed = false;
        lastWheelAt = 0;
        el.classList.remove("is-pulling");
        hint.classList.remove("ready");
        hint.textContent = NoteSketch.strings.pullHint;
        hint.style.opacity = "";
      }

      resetListPullState = resetPull;

      function tryTrigger() {
        if (Date.now() - lastTrigger < COOLDOWN) {
          resetPull();
          return;
        }
        lastTrigger = Date.now();
        resetPull();
        openAdd();
      }

      function updatePullVisual(dist, progress) {
        const p = Math.min(1, Math.max(0, progress));
        if (dist >= MIN_PULL * 0.25) {
          el.classList.add("is-pulling");
          hint.style.opacity = String(0.45 + p * 0.55);
          if (p >= 1) {
            hint.classList.add("ready");
            hint.textContent = NoteSketch.strings.pullHintReady;
          } else if (dist >= MIN_PULL) {
            hint.classList.remove("ready");
            const pct = Math.round(p * 100);
            hint.textContent = `${NoteSketch.strings.pullHintProgress} ${pct}%`;
          } else {
            hint.classList.remove("ready");
            hint.textContent = NoteSketch.strings.pullHint;
          }
        } else {
          el.classList.remove("is-pulling");
          hint.style.opacity = "";
        }
      }

      function tickHold(delta, atBottom) {
        if (!atBottom || delta < MIN_PULL) {
          holdStartAt = 0;
          holdArmed = false;
          updatePullVisual(delta, 0);
          return;
        }
        if (!holdStartAt) holdStartAt = Date.now();
        const progress = (Date.now() - holdStartAt) / HOLD_MS;
        updatePullVisual(delta, progress);
        if (progress >= 1 && !holdArmed) {
          holdArmed = true;
          tryTrigger();
        }
      }

      el.addEventListener(
        "touchstart",
        (e) => {
          if (!els.listView.classList.contains("active")) return;
          touchStartY = e.touches[0].clientY;
          pullDistance = 0;
          holdStartAt = 0;
          holdArmed = false;
        },
        { passive: true }
      );

      el.addEventListener(
        "touchmove",
        (e) => {
          if (!els.listView.classList.contains("active")) return;
          if (!isListAtBottom()) {
            resetPull();
            return;
          }
          const y = e.touches[0].clientY;
          const delta = touchStartY - y;
          if (delta <= 0) {
            resetPull();
            return;
          }
          pullDistance = delta;
          if (delta >= MIN_PULL) e.preventDefault();
          tickHold(pullDistance, true);
        },
        { passive: false }
      );

      el.addEventListener("touchend", () => resetPull(), { passive: true });
      el.addEventListener("touchcancel", () => resetPull(), { passive: true });

      el.addEventListener(
        "wheel",
        (e) => {
          if (!els.listView.classList.contains("active")) return;
          const now = Date.now();
          if (!isListAtBottom() || e.deltaY <= 0) {
            resetPull();
            return;
          }
          if (lastWheelAt && now - lastWheelAt > WHEEL_GAP_MS) {
            wheelAcc = 0;
            holdStartAt = 0;
            holdArmed = false;
          }
          lastWheelAt = now;
          wheelAcc += e.deltaY;
          if (wheelAcc < MIN_PULL) {
            holdStartAt = 0;
            holdArmed = false;
            updatePullVisual(wheelAcc, 0);
            return;
          }
          if (!holdStartAt) holdStartAt = now;
          const progress = (now - holdStartAt) / HOLD_MS;
          updatePullVisual(wheelAcc, progress);
          if (progress >= 1) {
            e.preventDefault();
            if (!holdArmed) {
              holdArmed = true;
              tryTrigger();
            }
          }
        },
        { passive: false }
      );
    }

    function openAdd() {
      resetListPullState();
      els.titleInput.value = "";
      els.contentInput.value = "";
      els.fieldHint.classList.remove("show");
      els.fieldHint.textContent = "";
      showView("add");
      setTimeout(() => els.titleInput.focus(), 50);
    }

    function exitAddAndSave() {
      const titleRaw = els.titleInput.value.trim();
      const content = els.contentInput.value.trim();
      if (!titleRaw && !content) {
        showView("list");
        return;
      }
      let title = titleRaw;
      if (!title) {
        const firstLine = content.split(/\n/)[0].trim();
        title = (firstLine || NoteSketch.strings.untitled).slice(0, 80);
      }
      const now = Date.now();
      const newId = nextId++;
      notes.push({
        id: newId,
        title,
        content,
        createdAt: now,
        stage: 0,
        nextReviewTime: NoteSketch.reviewTimeFor(now, 0),
        finished: false,
      });
      saveNotes();
      showView("list");
      renderList(newId);
      scrollListToBottom();
    }

    function openDetail(id) {
      const note = notes.find((n) => n.id === id);
      if (!note) {
        showView("list");
        return;
      }
      currentNoteId = id;
      exitDetailEdit(false);
      els.detailTitle.textContent = note.title;
      els.detailBody.textContent = note.content || NoteSketch.strings.noBody;
      renderTimeline(note);
      showView("detail");
    }

    function enterDetailEdit() {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note) return;
      els.detailPaper.classList.add("is-editing");
      els.detailEditTitle.value = note.title;
      els.detailEditBody.textContent = note.content || "";
      els.detailEditTitle.focus();
      requestAnimationFrame(scrollDetailBodyToLatest);
    }

    function scrollDetailBodyToLatest() {
      const el = els.detailEditBody;
      if (!el) return;
      el.scrollTop = el.scrollHeight;
    }

    function exitDetailEdit(save) {
      if (save) {
        const note = notes.find((n) => n.id === currentNoteId);
        if (note) {
          const title = els.detailEditTitle.value.trim();
          if (!title) {
            showFieldHint("标题不能为空");
            return false;
          }
          note.title = title;
          note.content = (els.detailEditBody.innerText || "").replace(/\u00a0/g, " ").trim();
          saveNotes();
          els.detailTitle.textContent = note.title;
          els.detailBody.textContent = note.content || NoteSketch.strings.noBody;
          renderList();
        }
      }
      els.detailPaper.classList.remove("is-editing");
      return true;
    }

    function renderTimeline(note) {
      const n = NoteSketch.intervalDays.length;
      const progress = note.finished || note.stage >= n ? 100 : (note.stage / Math.max(n - 1, 1)) * 100;
      els.ebbingAxis.innerHTML = "";

      const boxes = document.createElement("div");
      boxes.className = "ebbing-boxes";
      for (let i = 0; i < n; i++) {
        const done = note.finished || i < note.stage;
        const current = !note.finished && i === note.stage;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ebbing-box" + (done ? " done" : "") + (current ? " current" : "");
        btn.disabled = !current;
        btn.title = NoteSketch.stageLabel(i);
        if (current) {
          btn.addEventListener("click", () => completeStage(i));
        }
        boxes.appendChild(btn);
      }

      const track = document.createElement("div");
      track.className = "ebbing-track";
      const fill = document.createElement("div");
      fill.className = "ebbing-fill";
      fill.style.width = progress + "%";
      const ticks = document.createElement("div");
      ticks.className = "ebbing-ticks";
      for (let i = 0; i < n; i++) ticks.appendChild(document.createElement("span"));
      const fox = document.createElement("img");
      fox.className = "ebbing-fox";
      fox.src = "images/stickers/fox-deco-transparent.png";
      fox.alt = "";
      fox.style.left = progress + "%";
      track.append(fill, ticks, fox);

      const days = document.createElement("div");
      days.className = "ebbing-days";
      NoteSketch.intervalDays.forEach((d) => {
        const span = document.createElement("span");
        span.innerHTML = `${d}<small>天</small>`;
        days.appendChild(span);
      });

      els.ebbingAxis.append(boxes, track, days);
    }

    function completeStage(index) {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note || note.finished || index !== note.stage) {
        if (note) renderTimeline(note);
        return;
      }
      const nextStage = note.stage + 1;
      const nextTime = NoteSketch.reviewTimeFor(note.createdAt, nextStage);
      note.stage = nextStage;
      note.nextReviewTime = nextTime;
      note.finished = nextTime < 0;
      saveNotes();
      renderTimeline(note);
      renderList();
    }

    function bindBack(el, onBack) {
      el.addEventListener("click", onBack);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          onBack();
        }
      });
    }

    els.emptyState.textContent = NoteSketch.strings.empty;
    els.titleInput.placeholder = NoteSketch.strings.titleHint;
    els.contentInput.placeholder = NoteSketch.strings.contentHint;
    els.pullHint.textContent = NoteSketch.strings.pullHint;
    document.getElementById("interval-days").innerHTML = NoteSketch.intervalDays
      .map((d) => `<span>${d}</span>`)
      .join("");

    bindBack(document.getElementById("add-header"), exitAddAndSave);
    bindBack(document.getElementById("detail-header"), () => {
      if (els.detailPaper.classList.contains("is-editing")) {
        if (!exitDetailEdit(true)) return;
      }
      renderList();
      showView("list");
    });
    els.detailPaper.querySelector(".detail-view").addEventListener("click", enterDetailEdit);
    els.detailEditBody.addEventListener("input", scrollDetailBodyToLatest);
    els.detailEditBody.addEventListener("keyup", scrollDetailBodyToLatest);
    els.detailSave.addEventListener("click", (e) => {
      e.stopPropagation();
      exitDetailEdit(true);
    });
    els.fab.addEventListener("click", openAdd);

    initListPageScroll();
    initListPullToAdd();
    renderList();
    showView("list");
  </script>
</body>
</html>
