<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记忆笔记 · 拼贴手账 · 森林狐狸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f6f0e4;
      --grid: #ddd5c8;
      --ink: #3d3428;
      --muted: #7a6f62;
      --wood: #5c4030;
      --wood-light: #7a5844;
      --tape-teal: #7aab9e;
      --tape-orange: #e8a56a;
      --fox: #c45c2a;
      --due: #b03a32;
      --sticker-yellow: #fff3c4;
      --sticker-pink: #ffe4ec;
      --font-hand: "Patrick Hand", "Caveat", cursive;
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --spread-w: 390px;
      --phone-ratio-w: 9;
      --phone-ratio-h: 16;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Hide all scrollbars inside the phone mock / app; keep scroll working */
    .spread,
    .spread *,
    .desk,
    .desk * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .spread::-webkit-scrollbar,
    .spread *::-webkit-scrollbar,
    .desk::-webkit-scrollbar,
    .desk *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
      background: transparent !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--ink);
      line-height: 1.5;
      background: #3a2e26;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 12px;
      -webkit-font-smoothing: antialiased;
    }

    .desk {
      width: min(var(--spread-w), 100%);
      padding: 14px;
      background: linear-gradient(145deg, #4a3828 0%, #3a2e26 100%);
      border-radius: 4px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    .spread {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: min(
        calc(var(--spread-w) * var(--phone-ratio-h) / var(--phone-ratio-w)),
        calc(100vh - 32px)
      );
      max-height: min(
        calc(var(--spread-w) * var(--phone-ratio-h) / var(--phone-ratio-w)),
        calc(100vh - 32px)
      );
      min-height: 0;
      background-color: var(--cream);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 18px 18px;
      overflow: hidden;
      border: 2px solid rgba(92, 64, 48, 0.25);
    }

    .collage-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .tape {
      position: absolute;
      opacity: 0.88;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .tape-v {
      width: 28px;
      height: 110px;
      top: 48px;
      left: 6px;
      background: repeating-linear-gradient(
        180deg,
        var(--tape-orange),
        var(--tape-orange) 8px,
        rgba(255, 255, 255, 0.35) 8px,
        rgba(255, 255, 255, 0.35) 10px
      );
      transform: rotate(-4deg);
    }

    .tape-h {
      width: 100px;
      height: 22px;
      top: 12px;
      right: 56px;
      background: var(--tape-teal);
      transform: rotate(2deg);
      border-radius: 1px;
    }

    .tape-h::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px);
      background-size: 6px 6px;
    }

    .ribbon {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) rotate(-0.8deg);
      z-index: 2;
      padding: 8px 36px 10px;
      background: var(--tape-orange);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 1.45rem;
      letter-spacing: 0.06em;
      box-shadow: 0 2px 0 rgba(92, 64, 48, 0.2);
      clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
    }

    .settings-fox-btn {
      position: absolute;
      top: 2px;
      right: 0;
      z-index: 14;
      width: auto;
      height: auto;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 1px 3px rgba(61, 52, 40, 0.2));
      transition: transform 0.18s var(--ease);
    }
    .settings-fox-btn[hidden] {
      display: none !important;
    }
    .settings-fox-btn.tools-fox-btn {
      right: auto;
      left: 0;
    }
    .settings-fox-btn.tools-fox-btn img {
      transform: scaleX(-1);
    }
    .settings-fox-btn:hover { transform: scale(1.06) rotate(4deg); }
    .settings-fox-btn.tools-fox-btn:hover { transform: scale(1.06) rotate(-4deg); }
    .settings-fox-btn:active { transform: scale(0.96); }
    .settings-fox-btn img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    .settings-fox-btn .settings-label {
      display: block;
      font-family: var(--font-hand);
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin-top: -10px;
      line-height: 1;
      position: relative;
      z-index: 1;
      letter-spacing: 0.04em;
    }

    .ledger-summary {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      background: #fffef8;
      border: 2px solid rgba(61, 52, 40, 0.22);
      outline: 2px solid #fff;
    }
    .ledger-summary > div {
      flex: 1;
      text-align: center;
    }
    .ledger-summary .lab {
      font-family: var(--font-hand);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .ledger-summary .val {
      font-family: var(--font-hand);
      font-size: 1.15rem;
      color: var(--ink);
    }
    .ledger-summary .val.income { color: var(--tape-teal); }
    .ledger-summary .val.expense { color: var(--due); }
    .ledger-form .amount-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin: 8px 0 4px;
      position: relative;
    }
    .ledger-form .amount-input {
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
      height: 30px;
      box-sizing: border-box;
      border: 1.5px solid #3d5c4a;
      border-radius: 999px;
      background: #fffef8;
      font-family: var(--font-hand);
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      padding: 0 14px;
      margin: 0;
      text-align: center;
      line-height: 1;
    }
    .ledger-form .amount-input::placeholder {
      color: var(--muted);
      text-align: center;
    }
    .ledger-tag-btn {
      flex: 0 0 auto;
      min-width: 3.8em;
      max-width: 5.2em;
      height: 30px;
      border: 1.5px solid #3d5c4a;
      border-radius: 999px;
      background: #fffef8;
      font-family: var(--font-hand);
      font-size: 0.95rem;
      color: var(--ink);
      padding: 0 12px;
      cursor: pointer;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ledger-tag-btn:hover {
      background: color-mix(in srgb, var(--tape-teal) 16%, #fffef8);
    }
    .ledger-tag-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      z-index: 8;
      min-width: 7.5em;
      max-height: 220px;
      overflow-y: auto;
      padding: 4px;
      border: 1.5px solid #3d5c4a;
      border-radius: 12px;
      background: #fffef8;
      font-family: var(--font-hand);
      box-shadow: 0 4px 12px rgba(61, 52, 40, 0.12);
    }
    .ledger-tag-menu.open { display: block; }
    .ledger-tag-menu button {
      display: block;
      width: 100%;
      border: none;
      background: transparent;
      font-family: var(--font-hand);
      font-size: 0.95rem;
      color: var(--ink);
      text-align: left;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 8px;
    }
    .ledger-tag-menu button:hover,
    .ledger-tag-menu button.is-on {
      background: var(--tape-teal);
      color: #fffef8;
    }
    .ledger-type-row {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      width: 8.6em;
      height: 28px;
      margin-top: 6px;
      border: 1.5px solid #3d5c4a;
      border-radius: 999px;
      overflow: hidden;
      box-sizing: border-box;
      background: #fffef8;
    }
    .ledger-type-row button {
      width: 100%;
      min-width: 0;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      font-family: var(--font-hand);
      font-size: 0.95rem;
      color: var(--ink);
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: horizontal-tb;
      text-orientation: mixed;
    }
    .ledger-type-row button + button {
      border-left: 1.5px solid #3d5c4a;
    }
    .ledger-type-row button.is-on {
      background: linear-gradient(180deg, #8bb8ab 0%, var(--tape-teal) 55%, #5f9084 100%);
      color: #fffef8;
      text-shadow: 0 1px 0 rgba(61, 52, 40, 0.18);
    }
    .ledger-form .memo-input {
      display: none;
      width: 100%;
      box-sizing: border-box;
      height: 30px;
      margin: 6px 0 2px;
      border: 1.5px solid #3d5c4a;
      border-radius: 999px;
      background: #fffef8;
      font-family: var(--font-hand);
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      padding: 0 14px;
      text-align: left;
      line-height: 1;
    }
    .ledger-form .memo-input.show {
      display: block;
    }
    .ledger-form .memo-input::placeholder {
      color: var(--muted);
    }
    .ledger-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 2px 4px 2px 0;
      border: none;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 1px 2px rgba(61, 52, 40, 0.18));
      transition: transform 0.18s var(--ease);
    }
    .ledger-add-btn:hover { transform: scale(1.05) rotate(-3deg); }
    .ledger-add-btn:active { transform: scale(0.96); }
    .ledger-add-btn img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    .ledger-add-btn .save-label {
      font-family: var(--font-hand);
      font-size: 1rem;
      color: var(--ink);
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .ledger-list {
      list-style: none;
      margin-top: 8px;
      padding: 0;
    }
    .ledger-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fffef8;
      border: 2px solid rgba(61, 52, 40, 0.2);
    }
    .ledger-item .meta {
      flex: 1;
      min-width: 0;
    }
    .ledger-item .cat {
      font-family: var(--font-hand);
      font-size: 1rem;
      color: var(--ink);
    }
    .ledger-item .sub {
      font-size: 12px;
      color: var(--muted);
    }
    .ledger-item .amt {
      font-family: var(--font-hand);
      font-size: 1.05rem;
      white-space: nowrap;
    }
    .ledger-item .amt.out { color: var(--due); }
    .ledger-item .amt.in { color: var(--tape-teal); }
    .ledger-empty {
      font-family: var(--font-hand);
      color: var(--muted);
      text-align: center;
      padding: 20px 8px;
    }

    .spread[data-paper="blank"],
    #view-detail[data-paper="blank"],
    #view-settings[data-paper="blank"],
    #view-tools[data-paper="blank"],
    #view-ledger[data-paper="blank"],
    #view-add[data-paper="blank"] {
      background-image: none !important;
    }
    .spread[data-paper="lined"],
    #view-detail[data-paper="lined"],
    #view-settings[data-paper="lined"],
    #view-tools[data-paper="lined"],
    #view-ledger[data-paper="lined"],
    #view-add[data-paper="lined"] {
      background-image: linear-gradient(var(--grid) 1px, transparent 1px) !important;
      background-size: 100% 18px !important;
    }
    .spread[data-paper="grid"],
    #view-detail[data-paper="grid"],
    #view-settings[data-paper="grid"],
    #view-tools[data-paper="grid"],
    #view-ledger[data-paper="grid"],
    #view-add[data-paper="grid"] {
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) !important;
      background-size: 18px 18px !important;
    }
    .spread[data-paper="dots"],
    #view-detail[data-paper="dots"],
    #view-settings[data-paper="dots"],
    #view-tools[data-paper="dots"],
    #view-ledger[data-paper="dots"],
    #view-add[data-paper="dots"] {
      background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.2px) !important;
      background-size: 14px 14px !important;
    }

    .brightness-veil {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: #1a120c;
      opacity: 0;
      transition: opacity 0.2s var(--ease);
    }

    .side-board {
      position: absolute;
      top: 100px;
      right: 8px;
      width: 52px;
      padding: 12px 6px;
      background: linear-gradient(180deg, var(--wood-light), var(--wood));
      border: 2px solid #3d2818;
      border-radius: 3px;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.15);
      transform: rotate(1.5deg);
      z-index: 1;
    }

    .side-board p {
      font-family: var(--font-hand);
      font-size: 0.85rem;
      color: #f6e8dc;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .side-board .days {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .side-board .days span {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #ffe8d4;
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 6px;
      border-radius: 2px;
    }

    .scatter {
      position: absolute;
      color: var(--muted);
      opacity: 0.45;
    }

    .scatter-1 { top: 200px; left: 24px; width: 20px; }
    .scatter-2 { top: 320px; right: 68px; width: 16px; }
    .scatter-3 { bottom: 140px; left: 40px; width: 18px; }

    .side-fox {
      position: absolute;
      z-index: 2;
      width: clamp(56px, 18vw, 72px);
      height: auto;
      opacity: 0.9;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 2px 5px rgba(61, 52, 40, 0.14));
    }

    .side-fox--left {
      left: 4px;
      top: 36%;
      transform: rotate(-10deg);
    }

    .side-fox--right {
      right: 58px;
      top: 54%;
      transform: rotate(8deg) scaleX(-1);
    }

    .side-fox--left-alt {
      left: 8px;
      top: 62%;
      width: clamp(44px, 14vw, 56px);
      opacity: 0.72;
      transform: rotate(6deg);
    }

    .side-fox--right-alt {
      right: 64px;
      top: 28%;
      width: clamp(44px, 14vw, 56px);
      opacity: 0.72;
      transform: rotate(-6deg) scaleX(-1);
    }

    .forest-peep {
      position: absolute;
      z-index: 2;
      bottom: 0;
      width: 46%;
      height: 21%;
      max-height: 118px;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    .forest-peep--left {
      left: 0;
    }

    .forest-peep--right {
      right: 0;
    }

    .forest-peep img {
      position: absolute;
      bottom: 0;
      height: 100%;
      width: auto;
      max-width: none;
      opacity: 0.88;
      filter: drop-shadow(0 -1px 4px rgba(45, 70, 55, 0.08));
    }

    .forest-peep--left img {
      left: 0;
    }

    .forest-peep--right img {
      right: 0;
    }

    .app-layer {
      position: relative;
      z-index: 3;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      animation: viewIn 0.35s var(--ease);
    }

    .view.active { display: flex; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #view-list {
      background: transparent;
      overflow: hidden;
    }

    #view-list.active {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #view-add.active {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background-color: var(--add-paper, var(--cream));
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 18px 18px;
      box-shadow:
        inset 0 0 0 2px rgba(61, 52, 40, 0.08),
        inset 0 0 0 6px rgba(255, 255, 255, 0.45);
    }

    #view-detail.active {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background-color: var(--cream);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    #view-settings.active {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background-color: var(--cream);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    #view-tools.active {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background-color: #5c4030;
    }

    #view-tools .panel-head {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 3;
      padding: 48px 16px 12px;
      background: transparent;
    }

    .tools-board-wrap {
      position: absolute;
      inset: 0;
      margin: 0;
      display: block;
      overflow: hidden;
    }
    .tools-board-wrap > img.tools-board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: fill;
      display: block;
      filter: none;
      pointer-events: none;
      user-select: none;
    }
    .tools-board-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
      aspect-ratio: auto;
      transform: none;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .tools-title-stamp {
      position: absolute;
      left: 58%;
      top: 80%;
      width: 26%;
      height: 9%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-hand);
      font-size: 1.375rem; /* ~22sp */
      color: #3d2818;
      line-height: 1;
      letter-spacing: 0.06em;
      transform: rotate(22deg);
      transform-origin: center center;
      pointer-events: none;
      user-select: none;
    }
    .tools-grid {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 14%;
      bottom: 26%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: min-content;
      align-content: start;
      justify-items: center;
      gap: 10px 6px;
      overflow: auto;
      pointer-events: auto;
      scrollbar-width: none;
    }
    .tools-grid::-webkit-scrollbar { display: none; }
    .tools-tile {
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 96px;
      filter: drop-shadow(0 2px 3px rgba(61, 52, 40, 0.14));
      transition: transform 0.18s var(--ease);
      padding: 4px 2px;
      pointer-events: auto;
    }
    .tools-tile:hover { transform: scale(1.06) rotate(-3deg); }
    .tools-tile:active { transform: scale(0.96); }
    .tools-tile img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

  <script>
    const NoteSketch = {
      intervalDays: [1, 2, 4, 7, 15, 30],
      strings: {
        empty: "这一页还空着\n点下方狐狸，或滑到底后上拉按住\n进入新建页编辑便签",
        pullHint: "滑到底后，继续上拉并按住片刻",
        pullHintProgress: "继续按住…",
        pullHintReady: "即将进入新建页…",
        titleHint: "例如：英语单词 Unit 3",
        contentHint: "笔记内容 / 知识点…",
        untitled: "无标题",
        finishedAll: "已完成全部复习",
        due: "待复习",
        noBody: "（无正文）",
        delete: "撕掉",
      },
      stageLabel(stage) {
        if (stage >= this.intervalDays.length) return this.strings.finishedAll;
        return `第 ${stage + 1} 次复习 (第 ${this.intervalDays[stage]} 天)`;
      },
      reviewTimeFor(createdAt, stage) {
        if (stage >= this.intervalDays.length) return -1;
        return createdAt + this.intervalDays[stage] * 86400000;
      },
      formatDateTime(timeMs) {
        if (timeMs <= 0) return "—";
        const d = new Date(timeMs);
        return `${String(d.getMonth() + 1).padStart(2, "0")}月${String(d.getDate()).padStart(2, "0")}日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      },
      reviewText(nextReviewTime, finished) {
        if (finished) return this.strings.finishedAll;
        const diff = nextReviewTime - Date.now();
        const dayMs = 86400000;
        if (diff <= 0) return this.strings.due;
        if (diff < dayMs) return `下次：今天 ${this.formatDateTime(nextReviewTime)}`;
        if (diff < 2 * dayMs) return "下次：明天";
        return `下次：${this.formatDateTime(nextReviewTime)}`;
      },
      isDue(nextReviewTime, finished) {
        return !finished && nextReviewTime <= Date.now();
      },
    };

    const STORAGE_KEY = "notesketch-scrapbook-forest-v1";
    let notes = loadNotes();
    let nextId = notes.reduce((m, n) => Math.max(m, n.id), 0) + 1;
    let currentNoteId = null;
    let hintTimer = null;
    let resetListPullState = () => {};

    const els = {
      listView: document.getElementById("view-list"),
      addView: document.getElementById("view-add"),
      detailView: document.getElementById("view-detail"),
      settingsView: document.getElementById("view-settings"),
      settingsFoxBtn: document.getElementById("settings-fox-btn"),
      toolsView: document.getElementById("view-tools"),
      toolsFoxBtn: document.getElementById("tools-fox-btn"),
      toolsLedgerBtn: document.getElementById("tools-ledger-btn"),
      ledgerView: document.getElementById("view-ledger"),
      ledgerFoxBtn: null,
      ledgerBalance: document.getElementById("ledger-balance"),
      ledgerIncome: document.getElementById("ledger-income"),
      ledgerExpense: document.getElementById("ledger-expense"),
      ledgerAmount: document.getElementById("ledger-amount"),
      ledgerTagBtn: document.getElementById("ledger-tag-btn"),
      ledgerTagMenu: document.getElementById("ledger-tag-menu"),
      ledgerMemo: document.getElementById("ledger-memo"),
      ledgerList: document.getElementById("ledger-list"),
      ledgerEmpty: document.getElementById("ledger-empty"),
      ledgerAddBtn: document.getElementById("ledger-add-btn"),
      ledgerTypeExpense: document.getElementById("ledger-type-expense"),
      ledgerTypeIncome: document.getElementById("ledger-type-income"),
      brightnessVeil: document.getElementById("brightness-veil"),
      setBrightness: document.getElementById("set-brightness"),
      setBrightnessVal: document.getElementById("set-brightness-val"),
      setThemeRow: document.getElementById("set-theme-row"),
      setPaperRow: document.getElementById("set-paper-row"),
      addColorRow: document.getElementById("add-color-row"),
      detailColorRow: document.getElementById("detail-color-row"),
      detailPaper: document.getElementById("detail-paper"),
      detailEditTitle: document.getElementById("detail-edit-title"),
      detailEditBody: document.getElementById("detail-edit-body"),
      detailSave: document.getElementById("detail-save"),
      listScroll: document.getElementById("list-scroll"),
      pullHint: document.getElementById("pull-hint"),
      noteList: document.getElementById("note-list"),
      emptyState: document.getElementById("empty-state"),
      fab: document.getElementById("fab-fox"),
      titleInput: document.getElementById("input-title"),
      contentInput: document.getElementById("input-content"),
      fieldHint: document.getElementById("field-hint"),
      detailTitle: document.getElementById("detail-title"),
      detailBody: document.getElementById("detail-body"),
      timelineList: document.getElementById("timeline-list"),
      ebbingAxis: document.getElementById("ebbing-axis"),
      spread: document.querySelector(".spread"),
    };

    function loadNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      const now = Date.now();
      const day = 86400000;
      const aCreated = now - 2 * day;
      const bCreated = now - 8 * day;
      return [
        {
          id: 1,
          title: "英语单词 Unit 3",
          content: "acquire / retain / recall — 主动回忆比反复阅读更有效。",
          createdAt: aCreated,
          stage: 1,
          nextReviewTime: NoteSketch.reviewTimeFor(aCreated, 1),
          finished: false,
          colorId: "parchment",
        },
        {
          id: 2,
          title: "艾宾浩斯曲线要点",
          content: "间隔重复：1、2、4、7、15、30 天六个节点。",
          createdAt: bCreated,
          stage: 3,
          nextReviewTime: NoteSketch.reviewTimeFor(bCreated, 3),
          finished: false,
          colorId: "rose",
        },
      ];
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function showFieldHint(msg) {
      els.fieldHint.textContent = msg;
      els.fieldHint.classList.add("show");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => els.fieldHint.classList.remove("show"), 3200);
    }

    function showView(name) {
      els.listView.classList.toggle("active", name === "list");
      els.addView.classList.toggle("active", name === "add");
      els.detailView.classList.toggle("active", name === "detail");
      els.settingsView.classList.toggle("active", name === "settings");
      if (els.toolsView) els.toolsView.classList.toggle("active", name === "tools");
      if (els.ledgerView) els.ledgerView.classList.toggle("active", name === "ledger");
      const onList = name === "list";
      if (els.settingsFoxBtn) {
        els.settingsFoxBtn.hidden = !onList;
        els.settingsFoxBtn.style.pointerEvents = onList ? "" : "none";
      }
      if (els.toolsFoxBtn) {
        els.toolsFoxBtn.hidden = !onList;
        els.toolsFoxBtn.style.pointerEvents = onList ? "" : "none";
      }
    }

    const PREFS_KEY = "notesketch-scrapbook-prefs-v1";
    const THEMES = [
      { id: "forest", label: "森林狐狸", bg: "#F6F0E4", surface: "#F8F3E9", line: "#DDD5C8", ink: "#3D3428", muted: "#7A6F62", accent: "#7AAB9E" },
      { id: "parchment", label: "羊皮纸", bg: "#F6F0E4", surface: "#FFF3C4", line: "#DDD5C8", ink: "#3D3428", muted: "#7A6F62", accent: "#E8A56A" },
      { id: "sage", label: "苔绿", bg: "#E8F0DE", surface: "#E2EDD4", line: "#C5D0B8", ink: "#3D3428", muted: "#6F7A62", accent: "#5C7A54" },
      { id: "rose", label: "蜜桃", bg: "#F6EDE8", surface: "#FFE4EC", line: "#E0D5C8", ink: "#3D3428", muted: "#7A6F62", accent: "#C45C2A" },
      { id: "ink", label: "木纹", bg: "#EBE2D4", surface: "#E6D9C6", line: "#D0C0A8", ink: "#3D2818", muted: "#7A6F62", accent: "#5C4030" },
    ];
    const PAPER_TYPES = [
      { id: "grid", label: "网格" },
      { id: "blank", label: "空白" },
      { id: "lined", label: "横线" },
      { id: "dots", label: "网点" },
    ];

    function loadPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_KEY);
        if (raw) return { brightness: 100, themeId: "forest", paperType: "grid", ...JSON.parse(raw) };
      } catch (_) {}
      return { brightness: 100, themeId: "forest", paperType: "grid" };
    }

    let uiPrefs = loadPrefs();
    let addColorId = uiPrefs.themeId || "parchment";
    let detailColorId = "parchment";

    function savePrefs() {
      localStorage.setItem(PREFS_KEY, JSON.stringify(uiPrefs));
    }

    function currentTheme() {
      return THEMES.find((t) => t.id === uiPrefs.themeId) || THEMES[0];
    }

    function themeById(id) {
      return THEMES.find((t) => t.id === id) || THEMES.find((t) => t.id === "parchment") || THEMES[0];
    }

    function stickerSurface(id) {
      return themeById(id).surface || themeById(id).bg;
    }

    function applyUiPrefs() {
      const theme = currentTheme();
      const root = document.documentElement;
      root.style.setProperty("--cream", theme.bg);
      root.style.setProperty("--grid", theme.line);
      root.style.setProperty("--ink", theme.ink);
      root.style.setProperty("--muted", theme.muted);
      root.style.setProperty("--tape-teal", theme.accent);
      const paper = uiPrefs.paperType || "grid";
      [els.spread, els.detailView, els.settingsView, els.toolsView, els.ledgerView, els.addView].forEach((node) => {
        if (node) node.dataset.paper = paper;
      });
      if (els.brightnessVeil) {
        els.brightnessVeil.style.opacity = String(((100 - uiPrefs.brightness) / 100) * 0.55);
      }
      if (els.setBrightness) {
        els.setBrightness.value = String(uiPrefs.brightness);
        els.setBrightnessVal.textContent = String(uiPrefs.brightness);
      }
      renderSettingsChips();
    }

    function renderSettingsChips() {
      if (!els.setThemeRow || !els.setPaperRow) return;
      const theme = currentTheme();
      els.setThemeRow.innerHTML = "";
      THEMES.forEach((t) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "set-chip color-swatch" + (t.id === uiPrefs.themeId ? " is-on" : "");
        btn.textContent = t.label;
        btn.style.borderBottom = `4px solid ${t.bg}`;
        btn.addEventListener("click", () => {
          uiPrefs.themeId = t.id;
          savePrefs();
          applyUiPrefs();
        });
        els.setThemeRow.appendChild(btn);
      });
      els.setPaperRow.innerHTML = "";
      PAPER_TYPES.forEach((p) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "set-chip" + (p.id === uiPrefs.paperType ? " is-on" : "");
        btn.textContent = p.label;
        if (p.id === uiPrefs.paperType) {
          btn.style.background = theme.accent;
          btn.style.borderColor = theme.accent;
        }
        btn.addEventListener("click", () => {
          uiPrefs.paperType = p.id;
          savePrefs();
          applyUiPrefs();
        });
        els.setPaperRow.appendChild(btn);
      });
    }

    function openSettings() {
      applyUiPrefs();
      showView("settings");
    }

    function openTools() {
      applyUiPrefs();
      showView("tools");
    }

    const LEDGER_KEY = "notesketch-scrapbook-ledger-v1";
    const EXPENSE_CATS = ["餐饮", "交通", "学习", "日用", "娱乐", "其他"];
    const INCOME_CATS = ["工资", "红包", "兼职", "其他"];
    let ledgerEntries = loadLedger();
    let ledgerIsExpense = true;
    let ledgerCategory = EXPENSE_CATS[0];

    function loadLedger() {
      try {
        const raw = localStorage.getItem(LEDGER_KEY);
        if (raw) {
          const list = JSON.parse(raw);
          if (Array.isArray(list)) return list;
        }
      } catch (_) {}
      return [];
    }

    function saveLedger() {
      localStorage.setItem(LEDGER_KEY, JSON.stringify(ledgerEntries));
    }

    function formatYuan(cents) {
      return `¥${(cents / 100).toFixed(2)}`;
    }

    function renderLedgerType() {
      [els.ledgerTypeExpense, els.ledgerTypeIncome].forEach((btn) => {
        if (!btn) return;
        const on = (btn.dataset.expense === "1") === ledgerIsExpense;
        btn.classList.toggle("is-on", on);
        btn.style.background = "";
        btn.style.borderColor = "";
        btn.style.color = "";
      });
    }

    function currentLedgerCats() {
      return ledgerIsExpense ? EXPENSE_CATS : INCOME_CATS;
    }

    function tagPlaceholder() {
      return ledgerIsExpense ? "用途" : "来源";
    }

    function closeLedgerTagMenu() {
      if (!els.ledgerTagMenu) return;
      els.ledgerTagMenu.classList.remove("open");
      els.ledgerTagMenu.hidden = true;
      if (els.ledgerTagBtn) els.ledgerTagBtn.setAttribute("aria-expanded", "false");
    }

    function refreshLedgerTagBtn() {
      if (!els.ledgerTagBtn) return;
      const cats = currentLedgerCats();
      if (!cats.includes(ledgerCategory)) ledgerCategory = cats[0];
      els.ledgerTagBtn.textContent = ledgerCategory || tagPlaceholder();
      els.ledgerTagBtn.title = ledgerIsExpense ? "选择用途" : "选择来源";
      refreshLedgerMemoField(false);
    }

    function refreshLedgerMemoField(focus) {
      if (!els.ledgerMemo) return;
      const show = ledgerCategory === "其他";
      els.ledgerMemo.classList.toggle("show", show);
      if (!show) {
        els.ledgerMemo.value = "";
        return;
      }
      if (focus) {
        requestAnimationFrame(() => {
          els.ledgerMemo.focus();
          els.ledgerMemo.select?.();
        });
      }
    }

    function renderLedgerTagMenu() {
      if (!els.ledgerTagMenu) return;
      const cats = currentLedgerCats();
      els.ledgerTagMenu.innerHTML = "";
      cats.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("role", "option");
        btn.className = cat === ledgerCategory ? "is-on" : "";
        btn.textContent = cat;
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          ledgerCategory = cat;
          refreshLedgerTagBtn();
          closeLedgerTagMenu();
          if (cat === "其他") refreshLedgerMemoField(true);
        });
        els.ledgerTagMenu.appendChild(btn);
      });
    }

    function toggleLedgerTagMenu() {
      if (!els.ledgerTagMenu) return;
      const open = !els.ledgerTagMenu.classList.contains("open");
      if (open) {
        renderLedgerTagMenu();
        els.ledgerTagMenu.hidden = false;
        els.ledgerTagMenu.classList.add("open");
        if (els.ledgerTagBtn) els.ledgerTagBtn.setAttribute("aria-expanded", "true");
      } else {
        closeLedgerTagMenu();
      }
    }

    function renderLedger() {
      if (!els.ledgerList) return;
      let income = 0;
      let expense = 0;
      ledgerEntries.forEach((e) => {
        if (e.isExpense) expense += e.amountCents;
        else income += e.amountCents;
      });
      if (els.ledgerIncome) els.ledgerIncome.textContent = formatYuan(income);
      if (els.ledgerExpense) els.ledgerExpense.textContent = formatYuan(expense);
      if (els.ledgerBalance) els.ledgerBalance.textContent = formatYuan(income - expense);

      const sorted = [...ledgerEntries].sort((a, b) => b.createdAt - a.createdAt);
      els.ledgerList.innerHTML = "";
      if (els.ledgerEmpty) els.ledgerEmpty.hidden = sorted.length > 0;
      sorted.forEach((entry) => {
        const li = document.createElement("li");
        li.className = "ledger-item";
        const meta = document.createElement("div");
        meta.className = "meta";
        const cat = document.createElement("div");
        cat.className = "cat";
        cat.textContent = `${entry.category} · ${entry.isExpense ? "支出" : "收入"}`;
        const sub = document.createElement("div");
        sub.className = "sub";
        const time = NoteSketch.formatDateTime(entry.createdAt);
        sub.textContent = entry.memo ? `${entry.memo} · ${time}` : time;
        meta.appendChild(cat);
        meta.appendChild(sub);
        const amt = document.createElement("div");
        amt.className = "amt " + (entry.isExpense ? "out" : "in");
        amt.textContent = (entry.isExpense ? "-" : "+") + formatYuan(entry.amountCents);
        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-tear";
        del.textContent = NoteSketch.strings.delete;
        del.addEventListener("click", () => {
          ledgerEntries = ledgerEntries.filter((e) => e.id !== entry.id);
          saveLedger();
          renderLedger();
        });
        li.appendChild(meta);
        li.appendChild(amt);
        li.appendChild(del);
        els.ledgerList.appendChild(li);
      });
      renderLedgerType();
      refreshLedgerTagBtn();
      closeLedgerTagMenu();
    }

    function openLedger() {
      applyUiPrefs();
      renderLedger();
      showView("ledger");
    }

    function addLedgerEntry() {
      const raw = (els.ledgerAmount?.value || "").trim();
      const yuan = Number(raw);
      if (!Number.isFinite(yuan) || yuan <= 0) {
        alert("请输入有效金额");
        return;
      }
      const cents = Math.round(yuan * 100);
      const memo =
        ledgerCategory === "其他" ? (els.ledgerMemo?.value || "").trim() : "";
      const maxId = ledgerEntries.reduce((m, e) => Math.max(m, e.id || 0), 0);
      ledgerEntries.push({
        id: maxId + 1,
        amountCents: cents,
        isExpense: ledgerIsExpense,
        category: ledgerCategory,
        memo,
        createdAt: Date.now(),
      });
      saveLedger();
      if (els.ledgerAmount) els.ledgerAmount.value = "";
      if (els.ledgerMemo) els.ledgerMemo.value = "";
      renderLedger();
    }

    function sortedNotes() {
      return [...notes].sort((a, b) => a.createdAt - b.createdAt);
    }

    const tilts = [-0.45, 0.35, -0.3, 0.4, -0.35, 0.25];
    const shifts = [0, 4, -3, 5, -4, 2];
    let afterListRender = () => {};

    function renderList(highlightId = null) {
      const list = sortedNotes();
      els.emptyState.classList.toggle("show", list.length === 0);
      els.emptyState.textContent = NoteSketch.strings.empty;
      els.noteList.innerHTML = "";

      list.forEach((note, i) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "note-sticker";
        if (note.id === highlightId) card.classList.add("note-sticker--new");
        card.dataset.noteId = String(note.id);
        const tilt = tilts[i % tilts.length];
        const shift = shifts[i % shifts.length];
        card.style.transform = `rotate(${tilt}deg) translateX(${shift}px)`;
        card.style.background = stickerSurface(note.colorId || "parchment");

        const h3 = document.createElement("h3");
        h3.textContent = note.title;

        const preview = document.createElement("div");
        preview.className = "preview";
        preview.textContent = note.content || "";

        const meta = document.createElement("div");
        meta.className = "meta";

        const when = document.createElement("span");
        when.className = "when";
        when.textContent = NoteSketch.reviewText(note.nextReviewTime, note.finished);
        if (NoteSketch.isDue(note.nextReviewTime, note.finished)) when.classList.add("due");

        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-tear";
        del.textContent = NoteSketch.strings.delete;
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          notes = notes.filter((n) => n.id !== note.id);
          saveNotes();
          renderList();
        });

        meta.append(when, del);
        card.append(h3, preview, meta);
        card.addEventListener("click", () => openDetail(note.id));
        els.noteList.appendChild(card);
      });
      afterListRender();
    }

    function getListMaxScroll() {
      const el = els.listScroll;
      return Math.max(0, el.scrollHeight - el.clientHeight);
    }

    function scrollListToBottom() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const max = getListMaxScroll();
          els.listScroll.scrollTo({ top: max, behavior: "auto" });
        });
      });
    }

    function isListAtBottom() {
      const el = els.listScroll;
      return el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
    }

    function initListPageScroll() {
      afterListRender = () => {};
    }

    function initListPullToAdd() {
      const el = els.listScroll;
      const hint = els.pullHint;
      const MIN_PULL = 48;
      const HOLD_MS = 700;
      const COOLDOWN = 800;
      const WHEEL_GAP_MS = 150;
      let touchStartY = 0;
      let pullDistance = 0;
      let holdStartAt = 0;
      let lastTrigger = 0;
      let wheelAcc = 0;
      let lastWheelAt = 0;
      let holdArmed = false;

      function resetPull() {
        pullDistance = 0;
        wheelAcc = 0;
        holdStartAt = 0;
        holdArmed = false;
        lastWheelAt = 0;
        el.classList.remove("is-pulling");
        hint.classList.remove("ready");
        hint.textContent = NoteSketch.strings.pullHint;
        hint.style.opacity = "";
      }

      resetListPullState = resetPull;

      function tryTrigger() {
        if (Date.now() - lastTrigger < COOLDOWN) {
          resetPull();
          return;
        }
        lastTrigger = Date.now();
        resetPull();
        openAdd();
      }

      function updatePullVisual(dist, progress) {
        const p = Math.min(1, Math.max(0, progress));
        if (dist >= MIN_PULL * 0.25) {
          el.classList.add("is-pulling");
          hint.style.opacity = String(0.45 + p * 0.55);
          if (p >= 1) {
            hint.classList.add("ready");
            hint.textContent = NoteSketch.strings.pullHintReady;
          } else if (dist >= MIN_PULL) {
            hint.classList.remove("ready");
            const pct = Math.round(p * 100);
            hint.textContent = `${NoteSketch.strings.pullHintProgress} ${pct}%`;
          } else {
            hint.classList.remove("ready");
            hint.textContent = NoteSketch.strings.pullHint;
          }
        } else {
          el.classList.remove("is-pulling");
          hint.style.opacity = "";
        }
      }

      function tickHold(delta, atBottom) {
        if (!atBottom || delta < MIN_PULL) {
          holdStartAt = 0;
          holdArmed = false;
          updatePullVisual(delta, 0);
          return;
        }
        if (!holdStartAt) holdStartAt = Date.now();
        const progress = (Date.now() - holdStartAt) / HOLD_MS;
        updatePullVisual(delta, progress);
        if (progress >= 1 && !holdArmed) {
          holdArmed = true;
          tryTrigger();
        }
      }

      el.addEventListener(
        "touchstart",
        (e) => {
          if (!els.listView.classList.contains("active")) return;
          touchStartY = e.touches[0].clientY;
          pullDistance = 0;
          holdStartAt = 0;
          holdArmed = false;
        },
        { passive: true }
      );

      el.addEventListener(
        "touchmove",
        (e) => {
          if (!els.listView.classList.contains("active")) return;
          if (!isListAtBottom()) {
            resetPull();
            return;
          }
          const y = e.touches[0].clientY;
          const delta = touchStartY - y;
          if (delta <= 0) {
            resetPull();
            return;
          }
          pullDistance = delta;
          if (delta >= MIN_PULL) e.preventDefault();
          tickHold(pullDistance, true);
        },
        { passive: false }
      );

      el.addEventListener("touchend", () => resetPull(), { passive: true });
      el.addEventListener("touchcancel", () => resetPull(), { passive: true });

      el.addEventListener(
        "wheel",
        (e) => {
          if (!els.listView.classList.contains("active")) return;
          const now = Date.now();
          if (!isListAtBottom() || e.deltaY <= 0) {
            resetPull();
            return;
          }
          if (lastWheelAt && now - lastWheelAt > WHEEL_GAP_MS) {
            wheelAcc = 0;
            holdStartAt = 0;
            holdArmed = false;
          }
          lastWheelAt = now;
          wheelAcc += e.deltaY;
          if (wheelAcc < MIN_PULL) {
            holdStartAt = 0;
            holdArmed = false;
            updatePullVisual(wheelAcc, 0);
            return;
          }
          if (!holdStartAt) holdStartAt = now;
          const progress = (now - holdStartAt) / HOLD_MS;
          updatePullVisual(wheelAcc, progress);
          if (progress >= 1) {
            e.preventDefault();
            if (!holdArmed) {
              holdArmed = true;
              tryTrigger();
            }
          }
        },
        { passive: false }
      );
    }

    function applyAddPageColor() {
      const color = stickerSurface(addColorId);
      if (els.addView) {
        els.addView.style.backgroundColor = color;
      }
      document.documentElement.style.setProperty("--add-paper", color);
    }

    function openAdd() {
      resetListPullState();
      els.titleInput.value = "";
      els.contentInput.value = "";
      els.fieldHint.classList.remove("show");
      els.fieldHint.textContent = "";
      addColorId = uiPrefs.themeId || "parchment";
      renderAddColorChips();
      applyUiPrefs();
      applyAddPageColor();
      showView("add");
      setTimeout(() => els.titleInput.focus(), 50);
    }

    function renderAddColorChips() {
      if (!els.addColorRow) return;
      const theme = currentTheme();
      els.addColorRow.innerHTML = "";
      THEMES.forEach((t) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "set-chip color-swatch" + (t.id === addColorId ? " is-on" : "");
        btn.textContent = t.label;
        btn.style.background = t.id === addColorId ? theme.accent : t.surface;
        btn.style.borderColor = t.id === addColorId ? theme.accent : t.line;
        if (t.id === addColorId) btn.style.color = "#fff";
        btn.addEventListener("click", () => {
          addColorId = t.id;
          renderAddColorChips();
          applyAddPageColor();
        });
        els.addColorRow.appendChild(btn);
      });
    }

    function exitAddAndSave() {
      const titleRaw = els.titleInput.value.trim();
      const content = els.contentInput.value.trim();
      if (!titleRaw && !content) {
        showView("list");
        return;
      }
      let title = titleRaw;
      if (!title) {
        const firstLine = content.split(/\n/)[0].trim();
        title = (firstLine || NoteSketch.strings.untitled).slice(0, 80);
      }
      const now = Date.now();
      const newId = nextId++;
      notes.push({
        id: newId,
        title,
        content,
        createdAt: now,
        stage: 0,
        nextReviewTime: NoteSketch.reviewTimeFor(now, 0),
        finished: false,
        colorId: addColorId || "parchment",
      });
      saveNotes();
      showView("list");
      renderList(newId);
      scrollListToBottom();
    }

    function applyDetailPaperColor(colorId) {
      if (!els.detailPaper) return;
      els.detailPaper.style.background = stickerSurface(colorId || "parchment");
    }

    function openDetail(id) {
      const note = notes.find((n) => n.id === id);
      if (!note) {
        showView("list");
        return;
      }
      currentNoteId = id;
      detailColorId = note.colorId || "parchment";
      exitDetailEdit(false);
      els.detailTitle.textContent = note.title;
      els.detailBody.textContent = note.content || NoteSketch.strings.noBody;
      applyDetailPaperColor(detailColorId);
      renderTimeline(note);
      showView("detail");
    }

    function renderDetailColorChips() {
      if (!els.detailColorRow) return;
      const theme = currentTheme();
      els.detailColorRow.innerHTML = "";
      THEMES.forEach((t) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "set-chip color-swatch" + (t.id === detailColorId ? " is-on" : "");
        btn.textContent = t.label;
        btn.style.background = t.id === detailColorId ? theme.accent : t.surface;
        btn.style.borderColor = t.id === detailColorId ? theme.accent : t.line;
        if (t.id === detailColorId) btn.style.color = "#fff";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          detailColorId = t.id;
          applyDetailPaperColor(detailColorId);
          renderDetailColorChips();
        });
        els.detailColorRow.appendChild(btn);
      });
    }

    function enterDetailEdit() {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note) return;
      detailColorId = note.colorId || "parchment";
      els.detailPaper.classList.add("is-editing");
      els.detailEditTitle.value = note.title;
      els.detailEditBody.textContent = note.content || "";
      renderDetailColorChips();
      applyDetailPaperColor(detailColorId);
      els.detailEditTitle.focus();
      requestAnimationFrame(scrollDetailBodyToLatest);
    }

    function scrollDetailBodyToLatest() {
      const el = els.detailEditBody;
      if (!el) return;
      el.scrollTop = el.scrollHeight;
    }

    function exitDetailEdit(save) {
      if (save) {
        const note = notes.find((n) => n.id === currentNoteId);
        if (note) {
          const title = els.detailEditTitle.value.trim();
          if (!title) {
            showFieldHint("标题不能为空");
            return false;
          }
          note.title = title;
          note.content = (els.detailEditBody.innerText || "").replace(/\u00a0/g, " ").trim();
          note.colorId = detailColorId || note.colorId || "parchment";
          saveNotes();
          els.detailTitle.textContent = note.title;
          els.detailBody.textContent = note.content || NoteSketch.strings.noBody;
          applyDetailPaperColor(note.colorId);
          renderList();
        }
      }
      els.detailPaper.classList.remove("is-editing");
      return true;
    }

    function renderTimeline(note) {
      const n = NoteSketch.intervalDays.length;
      const progress = note.finished || note.stage >= n ? 100 : (note.stage / Math.max(n - 1, 1)) * 100;
      els.ebbingAxis.innerHTML = "";

      const boxes = document.createElement("div");
      boxes.className = "ebbing-boxes";
      for (let i = 0; i < n; i++) {
        const done = note.finished || i < note.stage;
        const current = !note.finished && i === note.stage;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ebbing-box" + (done ? " done" : "") + (current ? " current" : "");
        btn.disabled = !current;
        btn.title = NoteSketch.stageLabel(i);
        if (current) {
          btn.addEventListener("click", () => completeStage(i));
        }
        boxes.appendChild(btn);
      }

      const track = document.createElement("div");
      track.className = "ebbing-track";
      const fill = document.createElement("div");
      fill.className = "ebbing-fill";
      fill.style.width = progress + "%";
      const ticks = document.createElement("div");
      ticks.className = "ebbing-ticks";
      for (let i = 0; i < n; i++) ticks.appendChild(document.createElement("span"));
      const fox = document.createElement("img");
      fox.className = "ebbing-fox";
      fox.src = "images/stickers/fox-deco-transparent.png";
      fox.alt = "";
      fox.style.left = progress + "%";
      track.append(fill, ticks, fox);

      const days = document.createElement("div");
      days.className = "ebbing-days";
      NoteSketch.intervalDays.forEach((d) => {
        const span = document.createElement("span");
        span.innerHTML = `${d}<small>天</small>`;
        days.appendChild(span);
      });

      els.ebbingAxis.append(boxes, track, days);
    }

    function completeStage(index) {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note || note.finished || index !== note.stage) {
        if (note) renderTimeline(note);
        return;
      }
      const nextStage = note.stage + 1;
      const nextTime = NoteSketch.reviewTimeFor(note.createdAt, nextStage);
      note.stage = nextStage;
      note.nextReviewTime = nextTime;
      note.finished = nextTime < 0;
      saveNotes();
      renderTimeline(note);
      renderList();
    }

    function bindBack(el, onBack) {
      el.addEventListener("click", onBack);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          onBack();
        }
      });
    }

    els.emptyState.textContent = NoteSketch.strings.empty;
    els.titleInput.placeholder = NoteSketch.strings.titleHint;
    els.contentInput.placeholder = NoteSketch.strings.contentHint;
    els.pullHint.textContent = NoteSketch.strings.pullHint;
    document.getElementById("interval-days").innerHTML = NoteSketch.intervalDays
      .map((d) => `<span>${d}</span>`)
      .join("");

    bindBack(document.getElementById("add-header"), exitAddAndSave);
    bindBack(document.getElementById("detail-header"), () => {
      if (els.detailPaper.classList.contains("is-editing")) {
        if (!exitDetailEdit(true)) return;
      }
      renderList();
      showView("list");
    });
    bindBack(document.getElementById("settings-header"), () => showView("list"));
    bindBack(document.getElementById("tools-header"), () => showView("list"));
    bindBack(document.getElementById("ledger-header"), () => showView("tools"));
    els.settingsFoxBtn.addEventListener("click", openSettings);
    if (els.toolsFoxBtn) els.toolsFoxBtn.addEventListener("click", openTools);
    if (els.toolsLedgerBtn) els.toolsLedgerBtn.addEventListener("click", openLedger);
    if (els.ledgerTagBtn) {
      els.ledgerTagBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleLedgerTagMenu();
      });
    }
    document.addEventListener("click", (e) => {
      if (!els.ledgerTagMenu || !els.ledgerTagMenu.classList.contains("open")) return;
      const row = document.getElementById("ledger-amount-row");
      if (row && row.contains(e.target)) return;
      closeLedgerTagMenu();
    });
    if (els.ledgerTypeExpense) {
      els.ledgerTypeExpense.addEventListener("click", () => {
        ledgerIsExpense = true;
        ledgerCategory = EXPENSE_CATS[0];
        renderLedgerType();
        refreshLedgerTagBtn();
        closeLedgerTagMenu();
      });
    }
    if (els.ledgerTypeIncome) {
      els.ledgerTypeIncome.addEventListener("click", () => {
        ledgerIsExpense = false;
        ledgerCategory = INCOME_CATS[0];
        renderLedgerType();
        refreshLedgerTagBtn();
        closeLedgerTagMenu();
      });
    }
    if (els.ledgerAddBtn) els.ledgerAddBtn.addEventListener("click", addLedgerEntry);
    els.setBrightness.addEventListener("input", () => {
      uiPrefs.brightness = Number(els.setBrightness.value);
      els.setBrightnessVal.textContent = String(uiPrefs.brightness);
      savePrefs();
      applyUiPrefs();
    });
    els.detailPaper.querySelector(".detail-view").addEventListener("click", enterDetailEdit);
    els.detailEditBody.addEventListener("input", scrollDetailBodyToLatest);
    els.detailEditBody.addEventListener("keyup", scrollDetailBodyToLatest);
    els.detailSave.addEventListener("click", (e) => {
      e.stopPropagation();
      exitDetailEdit(true);
    });
    els.fab.addEventListener("click", openAdd);

    initListPageScroll();
    initListPullToAdd();
    applyUiPrefs();
    renderList();
    showView("list");
  </script>
</body>
</html>
